<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metrônomo - Academia de Música</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #020617;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .voltar {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            background: #111827;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .titulo {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .visor {
            flex: 1;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .rotulo {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .bpm {
            font-size: 7rem;
            font-weight: bold;
            line-height: 1;
            margin: 10px 0;
            transition: transform 0.08s ease;
        }

        .bpm.pulso {
            transform: scale(1.08);
        }

        .bpm-label {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .controles-bpm {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn-bpm {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 1px solid #334155;
            background: #111827;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        .btn-bpm:active {
            transform: scale(0.94);
        }

        .compasso-area {
            margin-top: 25px;
        }

        .compasso-titulo {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .compassos {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn-compasso {
            padding: 13px 5px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #111827;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-compasso.ativo {
            background: #2563eb;
            border-color: #3b82f6;
        }

        .botoes-principais {
            width: 100%;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .botao-iniciar,
        .botao-tela-cheia {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
        }

        .botao-iniciar {
            border: none;
            background: #16a34a;
        }

        .botao-iniciar.parado {
            background: #dc2626;
        }

        .botao-tela-cheia {
            border: 1px solid #334155;
            background: #111827;
        }

        .botao-tela-cheia:active,
        .botao-iniciar:active {
            transform: scale(0.98);
        }

        .batida {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #334155;
            margin: 25px auto 0;
            transition: 0.08s;
        }

        .batida.ativa {
            background: #ffffff;
            transform: scale(1.4);
        }


        /* =========================================
           MODO TELA CHEIA
           ========================================= */

        #modoTelaCheia {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #modoTelaCheia.ativo {
            display: flex;
        }

        #bpmTelaCheia {
            font-size: clamp(12rem, 35vw, 30rem);
            font-weight: bold;
            line-height: 1;
            color: #ffffff;
            text-align: center;
            user-select: none;
            transition: transform 0.08s ease;
        }

        #bpmTelaCheia.pulso {
            transform: scale(1.06);
        }

        .aviso-tela-cheia {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            opacity: 0.7;
        }


        /* Quando estiver realmente em fullscreen,
           garantimos que o modo ocupe tudo. */

        #modoTelaCheia:fullscreen {
            width: 100vw;
            height: 100vh;
            background: #000000;
        }


        @media (max-width: 600px) {

            .app {
                padding: 15px;
            }

            .bpm {
                font-size: 6rem;
            }

            .btn-bpm {
                width: 60px;
                height: 60px;
            }

            #bpmTelaCheia {
                font-size: clamp(10rem, 42vw, 18rem);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="topo">

        <a href="index.html" class="voltar">
            ← Voltar
        </a>

        <div class="titulo">
            🎵 Metrônomo
        </div>

        <div style="width: 75px;"></div>

    </div>


    <div class="visor">

        <div class="rotulo">
            TEMPO
        </div>

        <div id="bpm" class="bpm">
            80
        </div>

        <div class="bpm-label">
            BPM
        </div>


        <div class="controles-bpm">

            <button class="btn-bpm" onclick="alterarBpm(-5)">
                −
            </button>

            <button class="btn-bpm" onclick="alterarBpm(5)">
                +
            </button>

        </div>


        <div class="compasso-area">

            <div class="compasso-titulo">
                Fórmula de compasso
            </div>

            <div class="compassos">

                <button class="btn-compasso ativo"
                        onclick="alterarCompasso(2, this)">
                    2/4
                </button>

                <button class="btn-compasso"
                        onclick="alterarCompasso(3, this)">
                    3/4
                </button>

                <button class="btn-compasso"
                        onclick="alterarCompasso(4, this)">
                    4/4
                </button>

                <button class="btn-compasso"
                        onclick="alterarCompasso(6, this)">
                    6/8
                </button>

            </div>

        </div>


        <div class="botoes-principais">

            <button id="botaoIniciar"
                    class="botao-iniciar"
                    onclick="alternarMetronomo()">

                ▶ INICIAR

            </button>


            <button class="botao-tela-cheia"
                    onclick="abrirTelaCheia()">

                ⛶ TELA CHEIA

            </button>

        </div>


        <div id="batida" class="batida"></div>

    </div>

</div>


<!-- =========================================
     TELA DE METRÔNOMO GIGANTE
     ========================================= -->

<div id="modoTelaCheia">

    <div id="bpmTelaCheia">
        80
    </div>

    <div class="aviso-tela-cheia">
        Toque na tela ou pressione ESC para sair
    </div>

</div>


<script>

    let bpm = 80;

    let batidasPorCompasso = 2;

    let batidaAtual = 0;

    let intervalo = null;

    let tocando = false;


    /* =========================================
       ATUALIZAÇÃO DO BPM
       ========================================= */

    function atualizarBpm() {

        document.getElementById("bpm").textContent = bpm;

        document.getElementById("bpmTelaCheia").textContent = bpm;

    }


    /* =========================================
       ALTERAR BPM
       ========================================= */

    function alterarBpm(valor) {

        bpm += valor;

        if (bpm < 30) {
            bpm = 30;
        }

        if (bpm > 240) {
            bpm = 240;
        }

        atualizarBpm();

        if (tocando) {

            pararMetronomo();

            iniciarMetronomo();

        }

    }


    /* =========================================
       COMPASSO
       ========================================= */

    function alterarCompasso(valor, botao) {

        batidasPorCompasso = valor;

        document.querySelectorAll(".btn-compasso")
            .forEach(function(btn) {

                btn.classList.remove("ativo");

            });

        botao.classList.add("ativo");

        batidaAtual = 0;

    }


    /* =========================================
       SOM DA BATIDA
       ========================================= */

    function tocarBatida() {

        const elemento =
            document.getElementById("batida");

        elemento.classList.add("ativa");

        setTimeout(function() {

            elemento.classList.remove("ativa");

        }, 100);


        const numeroBpm =
            document.getElementById("bpm");

        const numeroTelaCheia =
            document.getElementById("bpmTelaCheia");


        numeroBpm.classList.add("pulso");

        numeroTelaCheia.classList.add("pulso");


        setTimeout(function() {

            numeroBpm.classList.remove("pulso");

            numeroTelaCheia.classList.remove("pulso");

        }, 100);


        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        if (!window.audioContext) {

            window.audioContext =
                new AudioContext();

        }


        const contexto =
            window.audioContext;


        const oscilador =
            contexto.createOscillator();

        const ganho =
            contexto.createGain();


        oscilador.connect(ganho);

        ganho.connect(contexto.destination);


        if (batidaAtual === 0) {

            oscilador.frequency.value = 1000;

        } else {

            oscilador.frequency.value = 700;

        }


        ganho.gain.setValueAtTime(
            0.3,
            contexto.currentTime
        );


        ganho.gain.exponentialRampToValueAtTime(
            0.001,
            contexto.currentTime + 0.08
        );


        oscilador.start();


        oscilador.stop(
            contexto.currentTime + 0.08
        );


        batidaAtual++;


        if (batidaAtual >= batidasPorCompasso) {

            batidaAtual = 0;

        }

    }


    /* =========================================
       INICIAR
       ========================================= */

    function iniciarMetronomo() {

        tocando = true;

        batidaAtual = 0;

        tocarBatida();


        const intervaloMs =
            60000 / bpm;


        intervalo = setInterval(
            tocarBatida,
            intervaloMs
        );


        const botao =
            document.getElementById("botaoIniciar");


        botao.textContent =
            "■ PARAR";


        botao.classList.add("parado");

    }


    /* =========================================
       PARAR
       ========================================= */

    function pararMetronomo() {

        tocando = false;

        clearInterval(intervalo);

        intervalo = null;

        batidaAtual = 0;


        const botao =
            document.getElementById("botaoIniciar");


        botao.textContent =
            "▶ INICIAR";


        botao.classList.remove("parado");

    }


    /* =========================================
       INICIAR / PARAR
       ========================================= */

    function alternarMetronomo() {

        if (tocando) {

            pararMetronomo();

        } else {

            iniciarMetronomo();

        }

    }


    /* =========================================
       ABRIR TELA CHEIA
       ========================================= */

    async function abrirTelaCheia() {

        const tela =
            document.getElementById("modoTelaCheia");


        tela.classList.add("ativo");


        try {

            if (tela.requestFullscreen) {

                await tela.requestFullscreen({
                    navigationUI: "hide"
                });

            }

        } catch (erro) {

            console.log(
                "Tela cheia não disponível:",
                erro
            );

        }

    }


    /* =========================================
       SAIR DA TELA CHEIA
       ========================================= */

    async function fecharTelaCheia() {

        try {

            if (document.fullscreenElement) {

                await document.exitFullscreen();

            }

        } catch (erro) {

            console.log(
                "Erro ao sair da tela cheia:",
                erro
            );

        }


        document
            .getElementById("modoTelaCheia")
            .classList.remove("ativo");

    }


    /* =========================================
       CLIQUE NA TELA CHEIA
       ========================================= */

    document
        .getElementById("modoTelaCheia")
        .addEventListener("click", function() {

            fecharTelaCheia();

        });


    /* =========================================
       ESC / SAÍDA DO FULLSCREEN
       ========================================= */

    document.addEventListener(
        "fullscreenchange",
        function() {

            if (!document.fullscreenElement) {

                document
                    .getElementById("modoTelaCheia")
                    .classList.remove("ativo");

            }

        }
    );


    /* =========================================
       INICIALIZAÇÃO
       ========================================= */

    atualizarBpm();

</script>

</body>
</html>
