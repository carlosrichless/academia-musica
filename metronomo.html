<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metrônomo - Academia de Música</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #020617;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .voltar {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            background: #111827;
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 10px;
        }

        .titulo {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .visor {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rotulo {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        .bpm {
            font-size: 7rem;
            font-weight: bold;
            line-height: 1;
            margin: 10px 0;
        }

        .bpm-label {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .controles-bpm {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .btn-bpm {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 1px solid #334155;
            background: #111827;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        .btn-bpm:active {
            transform: scale(0.94);
        }

        /* =========================================
           SEÇÕES DE CONFIGURAÇÃO
           ========================================= */

        .configuracao {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
        }

        .config-titulo {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 14px;
        }

        /* =========================================
           FÓRMULA DE COMPASSO
           ========================================= */

        .formula {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .formula-grupo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .formula-label {
            color: #64748b;
            font-size: 0.75rem;
        }

        .formula-controle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .formula-valor {
            min-width: 55px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
        }

        .formula-botao {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #111827;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .barra-formula {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 20px;
        }

        /* =========================================
           SUBDIVISÕES
           ========================================= */

        .subdivisoes {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }

        .btn-subdivisao {
            min-height: 65px;
            padding: 8px 4px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #111827;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-subdivisao strong {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .btn-subdivisao.ativo {
            background: #2563eb;
            border-color: #3b82f6;
        }

        /* =========================================
           BOTÕES PRINCIPAIS
           ========================================= */

        .botoes-principais {
            width: 100%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .botao-iniciar,
        .botao-tela-cheia {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .botao-iniciar {
            border: none;
            background: #16a34a;
        }

        .botao-iniciar.parado {
            background: #dc2626;
        }

        .botao-tela-cheia {
            border: 1px solid #334155;
            background: #111827;
        }

        .batida {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #334155;
            margin: 22px auto 0;
            transition: 0.08s;
        }

        .batida.ativa {
            background: #ffffff;
            transform: scale(1.4);
        }

        /* =========================================
           TELA CHEIA
           ========================================= */

        #modoTelaCheia {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        #modoTelaCheia.ativo {
            display: flex;
        }

        #contagemTelaCheia {
            font-size: clamp(14rem, 45vw, 35rem);
            font-weight: bold;
            line-height: 1;
            color: #ffffff;
            text-align: center;
            user-select: none;
            transition: transform 0.08s ease;
        }

        #contagemTelaCheia.pulso {
            transform: scale(1.08);
        }

        #modoTelaCheia.primeira-batida
        #contagemTelaCheia {
            color: #22c55e;
        }

        .infoTelaCheia {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
        }

        .compassoTelaCheia {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
        }

        @media (max-width: 600px) {

            .app {
                padding: 15px;
            }

            .bpm {
                font-size: 6rem;
            }

            .btn-bpm {
                width: 60px;
                height: 60px;
            }

            .subdivisoes {
                gap: 5px;
            }

            .btn-subdivisao {
                min-height: 62px;
                font-size: 0.68rem;
            }

            .btn-subdivisao strong {
                font-size: 1.1rem;
            }

            #contagemTelaCheia {
                font-size: clamp(11rem, 55vw, 20rem);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="topo">

        <a href="index.html" class="voltar">
            ← Voltar
        </a>

        <div class="titulo">
            🎵 Metrônomo
        </div>

        <div style="width: 65px;"></div>

    </div>


    <div class="visor">

        <div class="rotulo">
            TEMPO
        </div>

        <div id="bpm" class="bpm">
            80
        </div>

        <div class="bpm-label">
            BPM
        </div>


        <div class="controles-bpm">

            <button class="btn-bpm"
                    onclick="alterarBpm(-5)">
                −
            </button>

            <button class="btn-bpm"
                    onclick="alterarBpm(5)">
                +
            </button>

        </div>


        <!-- =====================================
             FÓRMULA DE COMPASSO
             ===================================== -->

        <div class="configuracao">

            <div class="config-titulo">
                FÓRMULA DE COMPASSO
            </div>


            <div class="formula">

                <!-- NUMERADOR -->

                <div class="formula-grupo">

                    <div class="formula-label">
                        NUMERADOR
                    </div>

                    <div class="formula-controle">

                        <button class="formula-botao"
                                onclick="alterarNumerador(-1)">
                            −
                        </button>

                        <div id="numerador"
                             class="formula-valor">
                            4
                        </div>

                        <button class="formula-botao"
                                onclick="alterarNumerador(1)">
                            +
                        </button>

                    </div>

                </div>


                <div class="barra-formula">
                    /
                </div>


                <!-- DENOMINADOR -->

                <div class="formula-grupo">

                    <div class="formula-label">
                        DENOMINADOR
                    </div>

                    <div class="formula-controle">

                        <button class="formula-botao"
                                onclick="alterarDenominador(-1)">
                            −
                        </button>

                        <div id="denominador"
                             class="formula-valor">
                            4
                        </div>

                        <button class="formula-botao"
                                onclick="alterarDenominador(1)">
                            +
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- =====================================
             SUBDIVISÃO SONORA
             ===================================== -->

        <div class="configuracao">

            <div class="config-titulo">
                SUBDIVISÃO SONORA
            </div>


            <div class="subdivisoes">

                <button class="btn-subdivisao ativo"
                        onclick="selecionarSubdivisao(1, this)">

                    <strong>♩</strong>
                    Semínima

                </button>


                <button class="btn-subdivisao"
                        onclick="selecionarSubdivisao(2, this)">

                    <strong>♪</strong>
                    Colcheia

                </button>


                <button class="btn-subdivisao"
                        onclick="selecionarSubdivisao(3, this)">

                    <strong>3</strong>
                    Tercina

                </button>


                <button class="btn-subdivisao"
                        onclick="selecionarSubdivisao(6, this)">

                    <strong>6</strong>
                    Sextina

                </button>


                <button class="btn-subdivisao"
                        onclick="selecionarSubdivisao(8, this)">

                    <strong>𝄾</strong>
                    Fusa

                </button>

            </div>

        </div>


        <!-- =====================================
             BOTÕES
             ===================================== -->

        <div class="botoes-principais">

            <button id="botaoIniciar"
                    class="botao-iniciar"
                    onclick="alternarMetronomo()"

                ▶ INICIAR

            </button>


            <button class="botao-tela-cheia"
                    onclick="abrirTelaCheia()">

                ⛶ TELA CHEIA

            </button>

        </div>


        <div id="batida"
             class="batida"></div>

    </div>

</div>


<!-- =========================================
     MODO TELA CHEIA
     ========================================= -->

<div id="modoTelaCheia">

    <div class="infoTelaCheia">
        CONTAGEM DO COMPASSO
    </div>

    <div id="contagemTelaCheia">
        1
    </div>

    <div id="compassoTelaCheia"
         class="compassoTelaCheia">
        4/4
    </div>

</div>


<script>

    /* =========================================
       CONFIGURAÇÕES
       ========================================= */

    let bpm = 80;

    let numerador = 4;

    let denominador = 4;

    let subdivisao = 1;

    let batidaAtual = 0;

    let subdivisaoAtual = 0;

    let intervalo = null;

    let tocando = false;


    /* =========================================
       BPM
       ========================================= */

    function atualizarBpm() {

        document.getElementById("bpm").textContent = bpm;

    }


    function alterarBpm(valor) {

        bpm += valor;

        if (bpm < 30) {
            bpm = 30;
        }

        if (bpm > 240) {
            bpm = 240;
        }

        atualizarBpm();

        if (tocando) {

            pararMetronomo();

            iniciarMetronomo();

        }

    }


    /* =========================================
       NUMERADOR
       ========================================= */

    function alterarNumerador(valor) {

        numerador += valor;

        if (numerador < 1) {
            numerador = 1;
        }

        if (numerador > 32) {
            numerador = 32;
        }

        batidaAtual = 0;

        atualizarFormula();

    }


    /* =========================================
       DENOMINADOR
       ========================================= */

    function alterarDenominador(valor) {

        const opcoes = [2, 4, 8, 16];

        let indice =
            opcoes.indexOf(denominador);

        indice += valor;

        if (indice < 0) {
            indice = 0;
        }

        if (indice >= opcoes.length) {
            indice = opcoes.length - 1;
        }

        denominador = opcoes[indice];

        batidaAtual = 0;

        atualizarFormula();

    }


    /* =========================================
       ATUALIZAR FÓRMULA
       ========================================= */

    function atualizarFormula() {

        document.getElementById("numerador")
            .textContent = numerador;

        document.getElementById("denominador")
            .textContent = denominador;

        atualizarContagemTelaCheia();

    }


    /* =========================================
       SUBDIVISÃO
       ========================================= */

    function selecionarSubdivisao(valor, botao) {

        subdivisao = valor;

        document
            .querySelectorAll(".btn-subdivisao")
            .forEach(function(btn) {

                btn.classList.remove("ativo");

            });

        botao.classList.add("ativo");


        if (tocando) {

            pararMetronomo();

            iniciarMetronomo();

        }

    }


    /* =========================================
       CONTAGEM PRINCIPAL
       ========================================= */

    function atualizarContagemTelaCheia() {

        const numero =
            document.getElementById(
                "contagemTelaCheia"
            );

        const compasso =
            document.getElementById(
                "compassoTelaCheia"
            );


        numero.textContent =
            batidaAtual + 1;


        compasso.textContent =
            numerador + "/" + denominador;

    }


    /* =========================================
       SOM
       ========================================= */

    function tocarSom(acento) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        if (!window.audioContext) {

            window.audioContext =
                new AudioContext();

        }


        const contexto =
            window.audioContext;


        const oscilador =
            contexto.createOscillator();

        const ganho =
            contexto.createGain();


        oscilador.connect(ganho);

        ganho.connect(contexto.destination);


        if (acento) {

            oscilador.frequency.value = 1100;

        } else {

            oscilador.frequency.value = 700;

        }


        ganho.gain.setValueAtTime(
            0.25,
            contexto.currentTime
        );


        ganho.gain.exponentialRampToValueAtTime(
            0.001,
            contexto.currentTime + 0.06
        );


        oscilador.start();


        oscilador.stop(
            contexto.currentTime + 0.06
        );

    }


    /* =========================================
       PULSO VISUAL
       ========================================= */

    function animarContagem(acento) {

        const numero =
            document.getElementById(
                "contagemTelaCheia"
            );

        const modo =
            document.getElementById(
                "modoTelaCheia"
            );


        numero.classList.remove("pulso");

        void numero.offsetWidth;

        numero.classList.add("pulso");


        if (acento) {

            modo.classList.add(
                "primeira-batida"
            );

        } else {

            modo.classList.remove(
                "primeira-batida"
            );

        }

    }


    /* =========================================
       BATIDA / SUBDIVISÃO
       ========================================= */

    function tocarBatida() {

        /*
         * A primeira subdivisão de cada tempo
         * é o tempo principal.
         */

        const primeiraSubdivisao =
            subdivisaoAtual === 0;


        /*
         * Primeiro tempo do compasso.
         */

        const primeiroTempo =
            batidaAtual === 0 &&
            primeiraSubdivisao;


        tocarSom(primeiroTempo);


        /*
         * Mostramos a contagem principal
         * somente no início de cada tempo.
         */

        if (primeiraSubdivisao) {

            atualizarContagemTelaCheia();

            animarContagem(primeiroTempo);

        }


        const elemento =
            document.getElementById("batida");


        elemento.classList.add("ativa");


        setTimeout(function() {

            elemento.classList.remove("ativa");

        }, 60);


        /*
         * Avança a subdivisão.
         */

        subdivisaoAtual++;


        /*
         * Terminou as subdivisões deste tempo.
         */

        if (subdivisaoAtual >= subdivisao) {

            subdivisaoAtual = 0;

            batidaAtual++;


            /*
             * Terminou o compasso.
             */

            if (batidaAtual >= numerador) {

                batidaAtual = 0;

            }

        }

    }


    /* =========================================
       INICIAR
       ========================================= */

    function iniciarMetronomo() {

        tocando = true;

        batidaAtual = 0;

        subdivisaoAtual = 0;


        /*
         * BPM representa o número de
         * tempos principais por minuto.
         */

        const tempoPrincipal =
            60000 / bpm;


        /*
         * Cada subdivisão divide
         * o tempo principal.
         */

        const intervaloSubdivisao =
            tempoPrincipal / subdivisao;


        tocarBatida();


        intervalo = setInterval(
            tocarBatida,
            intervaloSubdivisao
        );


        const botao =
            document.getElementById(
                "botaoIniciar"
            );


        botao.textContent =
            "■ PARAR";


        botao.classList.add("parado");

    }


    /* =========================================
       PARAR
       ========================================= */

    function pararMetronomo() {

        tocando = false;

        clearInterval(intervalo);

        intervalo = null;

        batidaAtual = 0;

        subdivisaoAtual = 0;

        atualizarContagemTelaCheia();


        const botao =
            document.getElementById(
                "botaoIniciar"
            );


        botao.textContent =
            "▶ INICIAR";


        botao.classList.remove("parado");

    }


    /* =========================================
       ALTERNAR
       ========================================= */

    function alternarMetronomo() {

        if (tocando) {

            pararMetronomo();

        } else {

            iniciarMetronomo();

        }

    }


    /* =========================================
       TELA CHEIA
       ========================================= */

    async function abrirTelaCheia() {

        const tela =
            document.getElementById(
                "modoTelaCheia"
            );


        atualizarContagemTelaCheia();

        tela.classList.add("ativo");


        try {

            if (tela.requestFullscreen) {

                await tela.requestFullscreen({
                    navigationUI: "hide"
                });

            }

        } catch (erro) {

            console.log(
                "Tela cheia não disponível:",
                erro
            );

        }

    }


    /* =========================================
       FECHAR TELA CHEIA
       ========================================= */

    async function fecharTelaCheia() {

        const tela =
            document.getElementById(
                "modoTelaCheia"
            );


        try {

            if (document.fullscreenElement) {

                await document.exitFullscreen();

            }

        } catch (erro) {

            console.log(
                "Erro ao sair da tela cheia:",
                erro
            );

        }


        tela.classList.remove("ativo");

    }


    /* =========================================
       TOQUE NA TELA CHEIA
       ========================================= */

    document
        .getElementById("modoTelaCheia")
        .addEventListener(
            "click",
            function() {

                fecharTelaCheia();

            }
        );


    /* =========================================
       ESC
       ========================================= */

    document.addEventListener(
        "fullscreenchange",
        function() {

            if (!document.fullscreenElement) {

                document
                    .getElementById(
                        "modoTelaCheia"
                    )
                    .classList.remove("ativo");

            }

        }
    );


    /* =========================================
       INICIALIZAÇÃO
       ========================================= */

    atualizarBpm();

    atualizarFormula();

</script>

</body>
</html>
