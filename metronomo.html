<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Metrônomo</title>


    <style>

        /* =====================================================
           BASE
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #020617;

            color: white;
        }


        /* =====================================================
           APLICATIVO
           ===================================================== */

        .app {

            min-height: 100vh;

            position: relative;

            overflow: hidden;

            padding: 25px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        /* =====================================================
           LOGO GRANDE NO FUNDO
           ===================================================== */

        .app::before {

            content: "";

            position: absolute;

            inset: 0;

            background-image: url(
                "https://raw.githubusercontent.com/carlosrichless/imagem-metronomo/main/logo%20c.richless.png"
            );

            background-repeat: no-repeat;

            background-position: center center;

            background-size: 125% auto;

            opacity: 0.14;

            z-index: 0;

            pointer-events: none;
        }


        .app::after {

            content: "";

            position: absolute;

            inset: 0;

            background: rgba(2, 6, 23, 0.30);

            z-index: 1;

            pointer-events: none;
        }


        /* =====================================================
           CONTEÚDO
           ===================================================== */

        .conteudo {

            width: 100%;

            max-width: 700px;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           TOPO
           ===================================================== */

        .topo {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .voltar {

            text-decoration: none;

            color: white;

            background: rgba(15, 23, 42, 0.9);

            border: 1px solid #334155;

            padding: 10px 16px;

            border-radius: 12px;

            font-size: 0.9rem;
        }


        h1 {

            margin: 0;

            text-align: center;

            font-size: 1.8rem;
        }


        /* =====================================================
           CARDS
           ===================================================== */

        .card {

            background: rgba(15, 23, 42, 0.88);

            border: 1px solid #334155;

            border-radius: 22px;

            padding: 25px;

            margin-bottom: 18px;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.3);
        }


        .label {

            text-align: center;

            color: #94a3b8;

            font-size: 0.85rem;

            margin-bottom: 8px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* =====================================================
           BPM
           ===================================================== */

        .bpm {

            text-align: center;

            font-size: 6rem;

            font-weight: bold;

            line-height: 1;

            margin: 10px 0 20px;
        }


        .descricao-bpm {

            text-align: center;

            color: #94a3b8;

            font-size: 0.78rem;

            margin-top: -12px;

            margin-bottom: 18px;
        }


        .controles-bpm {

            display: flex;

            justify-content: center;

            gap: 12px;
        }


        button {

            border: none;

            cursor: pointer;

            color: white;

            background: #1e293b;

            border: 1px solid #475569;

            border-radius: 14px;

            padding: 13px 20px;

            font-size: 1rem;

            font-weight: bold;
        }


        button:active {

            transform: scale(0.96);
        }


        .botao-principal {

            width: 100%;

            background: #2563eb;

            border-color: #3b82f6;

            font-size: 1.2rem;

            padding: 17px;

            margin-top: 20px;
        }


        .botao-principal.parar {

            background: #dc2626;

            border-color: #ef4444;
        }


        /* =====================================================
           BOTÃO NO >
           ===================================================== */

        .botao-no {

            width: 100%;

            margin-top: 12px;

            background: #1e293b;

            border-color: #475569;
        }


        .botao-no.ativo {

            background: #2563eb;

            border-color: #60a5fa;
        }


        /* =====================================================
           COMPASSO
           ===================================================== */

        .compasso {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }


        .campo-compasso {

            text-align: center;
        }


        .valor-compasso {

            font-size: 2.4rem;

            font-weight: bold;

            margin: 8px 0 12px;
        }


        .botoes-pequenos {

            display: flex;

            justify-content: center;

            gap: 7px;

            flex-wrap: wrap;
        }


        .botoes-pequenos button {

            padding: 9px 13px;

            font-size: 0.85rem;
        }


        .explicacao-compasso {

            text-align: center;

            color: #94a3b8;

            font-size: 0.78rem;

            margin-top: 18px;

            line-height: 1.5;
        }


        /* =====================================================
           SUBDIVISÕES
           ===================================================== */

        .subdivisoes {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 8px;
        }


        .subdivisao {

            padding: 12px 5px;

            font-size: 0.78rem;
        }


        .subdivisao.ativa {

            background: #2563eb;

            border-color: #60a5fa;
        }


        /* =====================================================
           INDICADOR DE BATIDA
           ===================================================== */

        .batida {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 20px;

            flex-wrap: wrap;
        }


        .ponto {

            width: 14px;

            height: 14px;

            border-radius: 50%;

            background: #334155;

            transition: 0.1s;
        }


        .ponto.ativo {

            background: #60a5fa;

            transform: scale(1.4);
        }


        .ponto.primeiro {

            background: #475569;
        }


        .ponto.primeiro.ativo {

            background: #f8fafc;
        }


        /* =====================================================
           BOTÃO TELA CHEIA
           ===================================================== */

        .tela-cheia-btn {

            width: 100%;

            margin-top: 12px;

            background: #0f172a;
        }


        /* =====================================================
           TELA CHEIA
           ===================================================== */

        #modoTelaCheia {

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            background: #020617;

            z-index: 99999;

            display: none;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        /* =====================================================
           NÚMERO GIGANTE
           ===================================================== */

        #contadorTelaCheia {

            font-size: 125vmin;

            font-weight: 900;

            line-height: 0.75;

            color: white;

            text-align: center;

            user-select: none;

            pointer-events: none;
        }


        /* =====================================================
           BOTÃO X
           ===================================================== */

        #fecharTelaCheia {

            position: fixed;

            top: 25px;

            right: 25px;

            z-index: 100000;

            width: 58px;

            height: 58px;

            padding: 0;

            border-radius: 50%;

            background: #1e293b;

            border: 1px solid #64748b;

            color: white;

            font-size: 2rem;

            line-height: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            pointer-events: auto;
        }


        /* =====================================================
           CELULAR
           ===================================================== */

        @media (max-width: 600px) {

            .app {

                padding: 15px;
            }


            .card {

                padding: 18px;

                border-radius: 18px;
            }


            .bpm {

                font-size: 5rem;
            }


            .compasso {

                gap: 10px;
            }


            .valor-compasso {

                font-size: 2rem;
            }


            .subdivisoes {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .subdivisao {

                padding: 12px;
            }


            .app::before {

                background-size: 150% auto;
            }


            /* NÚMERO GIGANTE NO CELULAR */

            #contadorTelaCheia {

                font-size: 150vw;

                line-height: 0.72;
            }


            #fecharTelaCheia {

                top: 18px;

                right: 18px;

                width: 52px;

                height: 52px;

                font-size: 1.8rem;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         APLICATIVO NORMAL
         ===================================================== -->

    <div class="app">


        <div class="conteudo">


            <!-- TOPO -->

            <div class="topo">

                <a
                    href="index.html"
                    class="voltar"
                >
                    ← Voltar
                </a>


                <h1>
                    🎵 Metrônomo
                </h1>


                <div
                    style="width:70px;"
                ></div>

            </div>



            <!-- =================================================
                 BPM
                 ================================================= -->

            <div class="card">


                <div class="label">
                    BPM
                </div>


                <div
                    class="bpm"
                    id="bpm"
                >
                    80
                </div>


                <div class="descricao-bpm">

                    BPM = semínima

                </div>


                <div class="controles-bpm">

                    <button
                        onclick="alterarBpm(-5)"
                    >
                        − 5
                    </button>


                    <button
                        onclick="alterarBpm(5)"
                    >
                        + 5
                    </button>

                </div>


                <button
                    id="botaoIniciar"
                    class="botao-principal"
                    onclick="alternarMetronomo()"
                >
                    ▶ INICIAR
                </button>


                <button
                    id="botaoNo"
                    class="botao-no"
                    onclick="alternarNo()"
                >
                    NO &gt;
                </button>


                <button
                    class="tela-cheia-btn"
                    onclick="abrirTelaCheia()"
                >
                    ⛶ TELA CHEIA
                </button>


                <div
                    class="batida"
                    id="indicadorBatida"
                ></div>


            </div>



            <!-- =================================================
                 COMPASSO
                 ================================================= -->

            <div class="card">


                <div class="label">
                    Fórmula de Compasso
                </div>


                <div class="compasso">


                    <!-- NUMERADOR -->

                    <div class="campo-compasso">


                        <div>
                            Numerador
                        </div>


                        <div
                            class="valor-compasso"
                            id="numerador"
                        >
                            4
                        </div>


                        <div class="botoes-pequenos">


                            <button
                                onclick="alterarNumerador(-1)"
                            >
                                −
                            </button>


                            <button
                                onclick="alterarNumerador(1)"
                            >
                                +
                            </button>


                        </div>


                    </div>



                    <!-- DENOMINADOR -->

                    <div class="campo-compasso">


                        <div>
                            Denominador
                        </div>


                        <div
                            class="valor-compasso"
                            id="denominador"
                        >
                            4
                        </div>


                        <div class="botoes-pequenos">


                            <button
                                onclick="alterarDenominador(-1)"
                            >
                                −
                            </button>


                            <button
                                onclick="alterarDenominador(1)"
                            >
                                +
                            </button>


                        </div>


                    </div>


                </div>


                <div class="explicacao-compasso">

                    O denominador define qual figura musical vale 1 pulso.
                    <br>
                    4 = semínima &nbsp;|&nbsp;
                    8 = colcheia &nbsp;|&nbsp;
                    16 = semicolcheia

                </div>


            </div>



            <!-- =================================================
                 SUBDIVISÃO
                 ================================================= -->

            <div class="card">


                <div class="label">
                    Subdivisão do tempo
                </div>


                <div class="subdivisoes">


                    <button
                        class="subdivisao ativa"
                        data-valor="1"
                        onclick="selecionarSubdivisao(1)"
                    >
                        Semínima
                    </button>


                    <button
                        class="subdivisao"
                        data-valor="2"
                        onclick="selecionarSubdivisao(2)"
                    >
                        Colcheia
                    </button>


                    <button
                        class="subdivisao"
                        data-valor="3"
                        onclick="selecionarSubdivisao(3)"
                    >
                        Tercina
                    </button>


                    <button
                        class="subdivisao"
                        data-valor="6"
                        onclick="selecionarSubdivisao(6)"
                    >
                        Sextina
                    </button>


                    <button
                        class="subdivisao"
                        data-valor="8"
                        onclick="selecionarSubdivisao(8)"
                    >
                        Fusa
                    </button>


                </div>


            </div>


        </div>


    </div>



    <!-- =====================================================
         TELA CHEIA
         ===================================================== -->

    <div
        id="modoTelaCheia"
    >


        <button
            id="fecharTelaCheia"
            type="button"
            onclick="fecharTelaCheia()"
            aria-label="Fechar tela cheia"
        >
            ×
        </button>


        <div
            id="contadorTelaCheia"
        >
            1
        </div>


    </div>



    <script>


        /* =====================================================
           CONFIGURAÇÕES
           ===================================================== */


        let bpm = 80;


        let numerador = 4;


        const denominadores = [
            2,
            4,
            8,
            16
        ];


        let indiceDenominador = 1;


        let subdivisao = 1;


        /*
           FALSE = tempo 1 com acento normal.

           TRUE = tempo 1 com exatamente
           o mesmo som dos demais tempos.
        */


        let noAtivo = false;


        /* =====================================================
           ESTADO DO METRÔNOMO
           ===================================================== */


        let tocando = false;


        let audioContext = null;


        let ganhoMestre = null;


        let timerScheduler = null;


        let proximaBatidaAudio = 0;


        let pulsoAtual = 0;


        let subdivisaoAtual = 0;


        let numeroExecucao = 0;


        let timersVisuais = [];


        /*
           O scheduler trabalha com antecedência.

           Isso evita que o navegador atrase os sons
           quando estiver executando outras tarefas.
        */


        const LOOKAHEAD_MS = 25;


        const SCHEDULE_AHEAD_TIME = 0.10;



        /* =====================================================
           PREPARAR ÁUDIO
           ===================================================== */


        function prepararAudio() {


            if (!audioContext) {


                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();


                ganhoMestre =
                    audioContext.createGain();


                ganhoMestre.gain.value = 0;


                ganhoMestre.connect(
                    audioContext.destination
                );

            }

        }



        /* =====================================================
           BPM
           ===================================================== */


        function alterarBpm(valor) {


            bpm += valor;


            if (bpm < 30) {

                bpm = 30;

            }


            if (bpm > 240) {

                bpm = 240;

            }


            document
                .getElementById("bpm")
                .innerText = bpm;


            if (tocando) {

                reiniciarMetronomo();

            }

        }



        /* =====================================================
           NUMERADOR
           ===================================================== */


        function alterarNumerador(valor) {


            numerador += valor;


            if (numerador < 1) {

                numerador = 1;

            }


            if (numerador > 32) {

                numerador = 32;

            }


            document
                .getElementById("numerador")
                .innerText = numerador;


            atualizarIndicadores();


            if (tocando) {

                reiniciarMetronomo();

            } else {

                atualizarContadorTelaCheia();

            }

        }



        /* =====================================================
           DENOMINADOR
           ===================================================== */


        function alterarDenominador(valor) {


            indiceDenominador += valor;


            if (
                indiceDenominador < 0
            ) {

                indiceDenominador =
                    denominadores.length - 1;

            }


            if (
                indiceDenominador >=
                denominadores.length
            ) {

                indiceDenominador = 0;

            }


            document
                .getElementById("denominador")
                .innerText =
                denominadores[
                    indiceDenominador
                ];


            /*
               O denominador agora realmente
               altera a duração do pulso.
            */


            if (tocando) {

                reiniciarMetronomo();

            }

        }



        /* =====================================================
           SUBDIVISÃO
           ===================================================== */


        function selecionarSubdivisao(valor) {


            subdivisao = valor;


            document
                .querySelectorAll(".subdivisao")
                .forEach(botao => {


                    botao.classList.remove(
                        "ativa"
                    );


                    if (
                        Number(
                            botao.dataset.valor
                        ) === valor
                    ) {

                        botao.classList.add(
                            "ativa"
                        );

                    }

                });


            if (tocando) {

                reiniciarMetronomo();

            }

        }



        /* =====================================================
           BOTÃO NO >
           ===================================================== */


        function alternarNo() {


            noAtivo = !noAtivo;


            const botao =
                document.getElementById(
                    "botaoNo"
                );


            if (noAtivo) {

                botao.classList.add(
                    "ativo"
                );

            } else {

                botao.classList.remove(
                    "ativo"
                );

            }


            /*
               Se o metrônomo estiver tocando,
               reinicia para aplicar a mudança
               imediatamente.
            */


            if (tocando) {

                reiniciarMetronomo();

            }

        }



        /* =====================================================
           OBTER DENOMINADOR
           ===================================================== */


        function obterDenominador() {

            return denominadores[
                indiceDenominador
            ];

        }



        /* =====================================================
           DURAÇÃO DO PULSO
           ===================================================== */


        function obterDuracaoDoPulso() {


            /*
               BPM é a referência da semínima.

               4/4:
               1 pulso = semínima

               4/8:
               1 pulso = colcheia

               4/16:
               1 pulso = semicolcheia


               Fórmula:

               duração =
               60 / BPM
               ×
               4 / denominador
            */


            const denominador =
                obterDenominador();


            return (
                60 / bpm
            ) * (
                4 / denominador
            );

        }



        /* =====================================================
           LIGAR / DESLIGAR
           ===================================================== */


        function alternarMetronomo() {


            if (tocando) {

                pararMetronomo();

            } else {

                iniciarMetronomo();

            }

        }



        /* =====================================================
           REINICIAR
           ===================================================== */


        function reiniciarMetronomo() {


            pararMetronomo();


            iniciarMetronomo();

        }



        /* =====================================================
           INICIAR
           ===================================================== */


        async function iniciarMetronomo() {


            prepararAudio();


            if (
                audioContext.state ===
                "suspended"
            ) {

                await audioContext.resume();

            }


            /*
               Nova execução.

               Isso invalida todos os timers
               visuais antigos.
            */


            numeroExecucao++;


            const execucaoAtual =
                numeroExecucao;


            limparTimersVisuais();


            if (timerScheduler) {

                clearTimeout(
                    timerScheduler
                );

                timerScheduler = null;

            }


            /*
               Começa sempre no pulso 1.
            */


            pulsoAtual = 0;


            subdivisaoAtual = 0;


            tocando = true;


            /*
               Libera o ganho mestre.
            */


            const agora =
                audioContext.currentTime;


            ganhoMestre.gain.cancelScheduledValues(
                agora
            );


            ganhoMestre.gain.setValueAtTime(
                1,
                agora
            );


            /*
               Pequena margem para o primeiro som.
            */


            proximaBatidaAudio =
                agora + 0.05;


            document
                .getElementById(
                    "botaoIniciar"
                )
                .innerText =
                "■ PARAR";


            document
                .getElementById(
                    "botaoIniciar"
                )
                .classList.add(
                    "parar"
                );


            atualizarIndicadores();


            /*
               Inicia o scheduler.
            */


            scheduler(
                execucaoAtual
            );

        }



        /* =====================================================
           SCHEDULER
           ===================================================== */


        function scheduler(execucaoAtual) {


            if (
                !tocando ||
                execucaoAtual !== numeroExecucao
            ) {

                return;

            }


            /*
               Agenda os sons que estão próximos.
            */


            while (
                proximaBatidaAudio <
                audioContext.currentTime +
                SCHEDULE_AHEAD_TIME
            ) {


                agendarSom(
                    proximaBatidaAudio,
                    pulsoAtual,
                    subdivisaoAtual,
                    execucaoAtual
                );


                avancarContagem();


            }


            timerScheduler =
                setTimeout(
                    () => {

                        scheduler(
                            execucaoAtual
                        );

                    },
                    LOOKAHEAD_MS
                );

        }



        /* =====================================================
           AGENDAR SOM
           ===================================================== */


        function agendarSom(
            tempo,
            pulso,
            sub,
            execucaoAtual
        ) {


            /*
               sub = 0 significa o pulso principal.

               sub = 1, 2, 3...
               são as subdivisões daquele pulso.
            */


            const pulsoPrincipal =
                sub === 0;


            let frequencia;


            if (pulsoPrincipal) {


                /*
                   Pulso 1 é mais forte,
                   exceto quando NO > está ativo.
                */


                if (noAtivo) {

                    frequencia = 700;

                } else {

                    frequencia =
                        pulso === 0
                            ? 1000
                            : 700;

                }


            } else {


                frequencia = 500;

            }


            tocarSomEm(
                tempo,
                frequencia
            );


            /*
               Atualização visual sincronizada
               com o instante real do áudio.
            */


            const atraso =
                Math.max(
                    0,
                    (
                        tempo -
                        audioContext.currentTime
                    ) * 1000
                );


            const timer =
                setTimeout(
                    () => {


                        timersVisuais =
                            timersVisuais.filter(
                                item =>
                                    item !== timer
                            );


                        if (
                            !tocando ||
                            execucaoAtual !==
                            numeroExecucao
                        ) {

                            return;

                        }


                        /*
                           A tela e os pontos mostram
                           o pulso, não a subdivisão.
                        */


                        mostrarBatidaVisual(
                            pulso
                        );


                        atualizarContadorTelaCheia(
                            pulso
                        );


                    },
                    atraso
                );


            timersVisuais.push(
                timer
            );


        }



        /* =====================================================
           AVANÇAR CONTAGEM
           ===================================================== */


        function avancarContagem() {


            /*
               Primeiro avançamos a subdivisão.
            */


            subdivisaoAtual++;


            /*
               Quando terminamos todas as subdivisões
               daquele pulso, passamos para o próximo pulso.
            */


            if (
                subdivisaoAtual >=
                subdivisao
            ) {


                subdivisaoAtual = 0;


                pulsoAtual++;


                /*
                   Quando terminamos todos os pulsos
                   do compasso, voltamos ao pulso 1.
                */


                if (
                    pulsoAtual >=
                    numerador
                ) {

                    pulsoAtual = 0;

                }

            }


            /*
               A duração de cada subdivisão é:

               duração do pulso /
               quantidade de subdivisões
            */


            proximaBatidaAudio +=
                obterDuracaoDoPulso() /
                subdivisao;

        }



        /* =====================================================
           PARAR
           ===================================================== */


        function pararMetronomo() {


            tocando = false;


            /*
               Invalida todos os timers
               da execução anterior.
            */


            numeroExecucao++;


            if (timerScheduler) {

                clearTimeout(
                    timerScheduler
                );

                timerScheduler = null;

            }


            limparTimersVisuais();


            /*
               Silencia inclusive os sons que
               eventualmente já tenham sido
               agendados pelo Web Audio.
            */


            if (
                audioContext &&
                ganhoMestre
            ) {


                const agora =
                    audioContext.currentTime;


                ganhoMestre.gain.cancelScheduledValues(
                    agora
                );


                ganhoMestre.gain.setValueAtTime(
                    0,
                    agora
                );

            }


            pulsoAtual = 0;


            subdivisaoAtual = 0;


            document
                .getElementById(
                    "botaoIniciar"
                )
                .innerText =
                "▶ INICIAR";


            document
                .getElementById(
                    "botaoIniciar"
                )
                .classList.remove(
                    "parar"
                );


            document
                .querySelectorAll(".ponto")
                .forEach(ponto => {

                    ponto.classList.remove(
                        "ativo"
                    );

                });


            atualizarContadorTelaCheia();

        }



        /* =====================================================
           LIMPAR TIMERS VISUAIS
           ===================================================== */


        function limparTimersVisuais() {


            timersVisuais.forEach(
                timer => {

                    clearTimeout(
                        timer
                    );

                }
            );


            timersVisuais = [];

        }



        /* =====================================================
           SOM
           ===================================================== */


        function tocarSomEm(
            tempo,
            frequencia
        ) {


            if (
                !audioContext ||
                !ganhoMestre
            ) {

                return;

            }


            const oscilador =
                audioContext.createOscillator();


            const ganho =
                audioContext.createGain();


            oscilador.frequency.value =
                frequencia;


            oscilador.type =
                "sine";


            /*
               Ataque rápido.
            */


            ganho.gain.setValueAtTime(
                0.0001,
                tempo
            );


            ganho.gain.exponentialRampToValueAtTime(
                0.30,
                tempo + 0.005
            );


            ganho.gain.exponentialRampToValueAtTime(
                0.0001,
                tempo + 0.08
            );


            oscilador.connect(
                ganho
            );


            ganho.connect(
                ganhoMestre
            );


            oscilador.start(
                tempo
            );


            oscilador.stop(
                tempo + 0.10
            );

        }



        /* =====================================================
           INDICADORES
           ===================================================== */


        function atualizarIndicadores() {


            const caixa =
                document.getElementById(
                    "indicadorBatida"
                );


            caixa.innerHTML = "";


            for (
                let i = 0;
                i < numerador;
                i++
            ) {


                const ponto =
                    document.createElement(
                        "div"
                    );


                ponto.className =
                    "ponto";


                if (i === 0) {

                    ponto.classList.add(
                        "primeiro"
                    );

                }


                ponto.id =
                    "ponto" + i;


                caixa.appendChild(
                    ponto
                );

            }

        }



        /* =====================================================
           INDICADOR VISUAL
           ===================================================== */


        function mostrarBatidaVisual(
            numero
        ) {


            document
                .querySelectorAll(
                    ".ponto"
                )
                .forEach(
                    ponto => {

                        ponto.classList.remove(
                            "ativo"
                        );

                    }
                );


            const ponto =
                document.getElementById(
                    "ponto" + numero
                );


            if (ponto) {


                ponto.classList.add(
                    "ativo"
                );


                setTimeout(
                    () => {

                        ponto.classList.remove(
                            "ativo"
                        );

                    },
                    120
                );

            }

        }



        /* =====================================================
           ABRIR TELA CHEIA
           ===================================================== */


        function abrirTelaCheia() {


            const tela =
                document.getElementById(
                    "modoTelaCheia"
                );


            tela.style.display =
                "flex";


            atualizarContadorTelaCheia();

        }



        /* =====================================================
           FECHAR TELA CHEIA
           ===================================================== */


        function fecharTelaCheia() {


            const tela =
                document.getElementById(
                    "modoTelaCheia"
                );


            tela.style.display =
                "none";

        }



        /* =====================================================
           CONTADOR DA TELA CHEIA
           ===================================================== */


        function atualizarContadorTelaCheia(
            pulso = null
        ) {


            let numero = 1;


            if (
                tocando &&
                pulso !== null
            ) {


                numero =
                    pulso + 1;


            } else if (tocando) {


                numero =
                    pulsoAtual + 1;

            }


            if (
                numero < 1
            ) {

                numero = 1;

            }


            if (
                numero > numerador
            ) {

                numero = 1;

            }


            document
                .getElementById(
                    "contadorTelaCheia"
                )
                .innerText =
                numero;

        }



        /* =====================================================
           ATALHOS DE TECLADO
           ===================================================== */

        let temposTap = [];

        const MAX_TAPS = 8;

        const TEMPO_MAXIMO_TAP = 2000;


        function tapTempo() {


            const agora =
                performance.now();


            /*
               Se demorou mais de 2 segundos
               desde o último toque, começa
               uma nova sequência.
            */


            if (
                temposTap.length > 0 &&
                agora -
                temposTap[
                    temposTap.length - 1
                ] >
                TEMPO_MAXIMO_TAP
            ) {

                temposTap = [];

            }


            temposTap.push(
                agora
            );


            /*
               Mantém somente os últimos 8 toques.
            */


            if (
                temposTap.length >
                MAX_TAPS
            ) {

                temposTap.shift();

            }


            /*
               Um toque sozinho ainda não
               consegue calcular BPM.
            */


            if (
                temposTap.length < 2
            ) {

                return;

            }


            let somaIntervalos = 0;


            for (
                let i = 1;
                i < temposTap.length;
                i++
            ) {

                somaIntervalos +=
                    temposTap[i] -
                    temposTap[i - 1];

            }


            const media =
                somaIntervalos /
                (
                    temposTap.length - 1
                );


            let novoBpm =
                60000 / media;


            novoBpm =
                Math.round(
                    novoBpm
                );


            /*
               Respeita os mesmos limites
               usados pelos botões do metrônomo.
            */


            if (
                novoBpm < 30
            ) {

                novoBpm = 30;

            }


            if (
                novoBpm > 240
            ) {

                novoBpm = 240;

            }


            bpm = novoBpm;


            document
                .getElementById("bpm")
                .innerText = bpm;


            /*
               Se o metrônomo já estiver tocando,
               reinicia para aplicar o novo BPM.
            */


            if (tocando) {

                reiniciarMetronomo();

            }

        }



        /* =====================================================
           TECLADO
           ===================================================== */


        document.addEventListener(
            "keydown",
            function(event) {


                /*
                   Não interfere caso o foco esteja
                   em algum campo de edição.
                */


                const alvo =
                    event.target;


                const digitando =
                    alvo instanceof
                        HTMLInputElement ||
                    alvo instanceof
                        HTMLTextAreaElement ||
                    alvo instanceof
                        HTMLSelectElement ||
                    alvo.isContentEditable;


                if (digitando) {

                    return;

                }


                /* =================================================
                   ESC → SAIR DA TELA CHEIA
                   ================================================= */


                if (
                    event.key === "Escape" ||
                    event.key === "Esc"
                ) {


                    event.preventDefault();


                    fecharTelaCheia();


                    return;

                }


                /* =================================================
                   ESPAÇO → PLAY / PAUSE
                   ================================================= */


                if (
                    event.code === "Space"
                ) {


                    event.preventDefault();


                    alternarMetronomo();


                    return;

                }


                /* =================================================
                   T → TAP TEMPO
                   ================================================= */


                if (
                    event.key.toLowerCase() === "t"
                ) {


                    event.preventDefault();


                    tapTempo();


                    return;

                }

            }
        );



        /* =====================================================
           GARANTIA DO BOTÃO X
           ===================================================== */


        document
            .getElementById(
                "fecharTelaCheia"
            )
            .addEventListener(
                "click",
                function(event) {


                    event.preventDefault();


                    event.stopPropagation();


                    fecharTelaCheia();

                }
            );



        /* =====================================================
           INICIALIZAÇÃO
           ===================================================== */


        atualizarIndicadores();


        document
            .getElementById(
                "denominador"
            )
            .innerText =
            obterDenominador();


    </script>


</body>

</html>
