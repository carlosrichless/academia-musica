            const numB = parseInt(b.titulo.match(/^\d+/)) || 0;
            return numA - numB;
        });

        const playlistEl = document.getElementById('playlist');
        const videoPlayer = document.getElementById('videoPlayer');
        const lessonTitleEl = document.getElementById('lessonTitle');

        function carregarAula(index) {
            const aula = aulas[index];
            videoPlayer.src = aula.url;
            lessonTitleEl.textContent = aula.titulo;

            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                if (i === index) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        aulas.forEach((aula, index) => {
            const div = document.createElement('div');
            div.className = 'playlist-item';
            div.textContent = (index + 1) + ". " + aula.titulo;
            div.onclick = () => carregarAula(index);
            playlistEl.appendChild(div);
        });

        if (aulas.length > 0) {
            carregarAula(0);
        }
