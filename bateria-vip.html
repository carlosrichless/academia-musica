<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áudios da Apostila de Bateria | C. Richless</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #34d399;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Barra Superior (igual à da apostila) */
        .top-bar {
            background-color: #1e293b;
            border-bottom: 1px solid var(--border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-title { color: var(--text-main); font-size: 1rem; font-weight: 600; }
        .btn-voltar {
            background: #2563eb;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-voltar:hover { background: #1d4ed8; }

        /* Conteúdo Principal */
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            flex-grow: 1;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            color: var(--success);
            font-size: 1.8rem;
        }

        /* Lista de Áudios */
        .audio-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .audio-card h3 {
            color: var(--accent);
            font-size: 1rem;
            margin-bottom: 12px;
        }
        audio {
            width: 100%;
            outline: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Proteção de Sessão -->
    <script>
        if (sessionStorage.getItem('bateria_liberada') !== 'true') {
            window.location.href = "bateria-vip.html";
        }
    </script>

    <!-- Barra Superior com botão de voltar -->
    <div class="top-bar">
        <div class="top-title">🎧 Áudios da Apostila de Bateria</div>
        <a href="bateria-vip.html" class="btn-voltar">← Voltar à Área VIP</a>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Áudios dos Exercícios</h1>
        </div>

        <!-- Os cards de áudio que você já usa -->
        <div class="audio-card">
            <h3>10 - LEVADAS</h3>
            <audio controls><source src="assets/audio10.wav" type="audio/wav">Seu navegador não suporta áudio.</audio>
        </div>

        <div class="audio-card">
            <h3>100 - OUTRAS LEVADAS 6 POR 9</h3>
            <audio controls><source src="assets/audio100.wav" type="audio/wav">Seu navegador não suporta áudio.</audio>
        </div>

        <div class="audio-card">
            <h3>101 - OUTRAS LEVADAS E NOTAS FANTASMAS</h3>
            <audio controls><source src="assets/audio101.wav" type="audio/wav">Seu navegador não suporta áudio.</audio>
        </div>

        <div class="audio-card">
            <h3>11 - LEVADAS COLCHEIA</h3>
            <audio controls><source src="assets/audio11.wav" type="audio/wav">Seu navegador não suporta áudio.</audio>
        </div>
    </div>

    <footer>
        Projeto Academia de Música - C. Richless &copy; 2026
    </footer>

</body>
</html>
