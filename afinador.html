<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Afinador - Academia de Música</title>

    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --card2: #111827;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #facc15;
            --blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .pagina {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }

        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .voltar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            font-weight: bold;
        }

        .titulo {
            text-align: center;
            flex: 1;
        }

        .titulo h1 {
            margin: 0;
            font-size: 2rem;
        }

        .titulo p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .afinador {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        /* NOTA DETECTADA */

        .nota-detectada {
            text-align: center;
            margin-bottom: 10px;
        }

        #notaAtual {
            font-size: clamp(5rem, 16vw, 10rem);
            font-weight: 900;
            line-height: 0.9;
            margin: 0;
        }

        #frequenciaAtual {
            margin-top: 12px;
            font-size: 1.2rem;
            color: var(--muted);
            min-height: 25px;
        }

        #mensagem {
            margin-top: 12px;
            min-height: 45px;
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 900;
            text-align: center;
        }

        /* MEDIDOR */

        .medidor {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 260px;
            margin: 15px auto 5px;
            overflow: hidden;
        }

        .arco {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(700px, 90vw);
            height: min(350px, 45vw);
            transform: translateX(-50%);
            border: 10px solid #1e293b;
            border-bottom: 0;
            border-radius: 700px 700px 0 0;
        }

        .marcacoes {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(700px, 90vw);
            height: min(350px, 45vw);
            transform: translateX(-50%);
        }

        .marcacao {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 5px;
            height: 32px;
            background: #64748b;
            transform-origin: 50% 100%;
            border-radius: 5px;
        }

        .marcacao.central {
            height: 48px;
            width: 8px;
            background: var(--green);
        }

        .agulha {
            position: absolute;
            left: 50%;
            bottom: 4px;
            width: 8px;
            height: min(230px, 36vw);
            background: #f8fafc;
            border-radius: 10px;
            transform-origin: 50% 100%;
            transform: translateX(-50%) rotate(0deg);
            transition: transform 0.08s linear;
            box-shadow: 0 0 15px rgba(255,255,255,0.35);
            z-index: 5;
        }

        .ponto-central {
            position: absolute;
            left: 50%;
            bottom: -8px;
            width: 30px;
            height: 30px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: #f8fafc;
            z-index: 6;
        }

        .escala {
            position: absolute;
            left: 50%;
            bottom: 8px;
            width: min(760px, 94vw);
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .escala .baixo {
            color: var(--red);
        }

        .escala .alto {
            color: var(--red);
        }

        .escala .centro {
            color: var(--green);
        }

        /* STATUS */

        .status {
            text-align: center;
            margin-top: -5px;
        }

        #statusAfinacao {
            font-size: 1rem;
            color: var(--muted);
        }

        /* MICROFONE */

        .microfone-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        #botaoMicrofone {
            border: 0;
            border-radius: 16px;
            padding: 16px 28px;
            background: var(--blue);
            color: #00111a;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            min-width: 230px;
        }

        #botaoMicrofone.ativo {
            background: var(--green);
        }

        #microfoneStatus {
            color: var(--muted);
            text-align: center;
            min-height: 22px;
        }

        /* REFERÊNCIAS */

        .referencia {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .referencia h2 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 1.3rem;
        }

        .referencia p {
            text-align: center;
            color: var(--muted);
            margin: 0 0 18px;
        }

        .botoes-notas {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        .botao-nota {
            min-height: 90px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: var(--text);
            cursor: pointer;
            font-size: 1.7rem;
            font-weight: 900;
            transition:
                transform 0.1s ease,
                background 0.1s ease,
                border-color 0.1s ease;
        }

        .botao-nota:hover {
            transform: translateY(-2px);
            border-color: var(--blue);
        }

        .botao-nota:active {
            transform: scale(0.97);
        }

        .botao-nota.tocando {
            background: #164e63;
            border-color: var(--blue);
            box-shadow: 0 0 20px rgba(56,189,248,0.25);
        }

        .botao-nota small {
            display: block;
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: normal;
        }

        /* RESPONSIVO */

        @media (max-width: 700px) {
            .pagina {
                padding: 12px;
            }

            .afinador {
                padding: 15px;
                border-radius: 18px;
            }

            .topo {
                flex-direction: column;
            }

            .titulo h1 {
                font-size: 1.5rem;
            }

            .voltar {
                width: 100%;
            }

            .medidor {
                height: 210px;
            }

            .arco,
            .marcacoes {
                height: 180px;
            }

            .agulha {
                height: 155px;
            }

            .ponto-central {
                width: 24px;
                height: 24px;
            }

            .escala {
                font-size: 0.72rem;
            }

            .botoes-notas {
                grid-template-columns: repeat(3, 1fr);
            }

            .botao-nota {
                min-height: 75px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

<div class="pagina">

    <div class="topo">

        <a href="index.html" class="voltar">
            ← Voltar
        </a>

        <div class="titulo">
            <h1>🎸 Afinador</h1>
            <p>Academia de Música</p>
        </div>

        <div style="width: 90px;"></div>

    </div>

    <main class="afinador">

        <div class="nota-detectada">

            <h2 id="notaAtual">—</h2>

            <div id="frequenciaAtual">
                Toque uma corda...
            </div>

        </div>

        <div id="mensagem">
            AGUARDANDO SOM
        </div>

        <div class="medidor">

            <div class="arco"></div>

            <div class="marcacoes">

                <div
                    class="marcacao"
                    style="transform: translateX(-50%) rotate(-45deg);">
                </div>

                <div
                    class="marcacao"
                    style="transform: translateX(-50%) rotate(-30deg);">
                </div>

                <div
                    class="marcacao"
                    style="transform: translateX(-50%) rotate(-15deg);">
                </div>

                <div
                    class="marcacao central"
                    style="transform: translateX(-50%) rotate(0deg);">
                </div>

                <div
                    class="marcacao"
                    style="transform: translateX(-50%) rotate(15deg);">
                </div>

                <div
                    class="marcacao"
                    style="transform: translateX(-50%) rotate(30deg);">
                </div>

                <div
                    class="marcacao"
                    style="transform: translateX(-50%) rotate(45deg);">
                </div>

            </div>

            <div
                id="agulha"
                class="agulha">
            </div>

            <div class="ponto-central"></div>

            <div class="escala">
                <span class="baixo">APERTAR</span>
                <span class="centro">AFINADO</span>
                <span class="alto">AFROUXAR</span>
            </div>

        </div>

        <div class="status">
            <div id="statusAfinacao">
                —
            </div>
        </div>

        <div class="microfone-area">

            <button
                id="botaoMicrofone"
                onclick="alternarMicrofone()">
                🎤 ATIVAR MICROFONE
            </button>

            <div id="microfoneStatus">
                O afinador ouvirá automaticamente a corda tocada.
            </div>

        </div>

        <section class="referencia">

            <h2>🔊 Som de referência</h2>

            <p>
                Clique na nota para ouvir continuamente.
                Clique novamente para parar.
            </p>

            <div class="botoes-notas">

                <button
                    class="botao-nota"
                    data-indice="0"
                    onclick="clicarReferencia(0)">
                    E
                    <small>Mi grave</small>
                </button>

                <button
                    class="botao-nota"
                    data-indice="1"
                    onclick="clicarReferencia(1)">
                    A
                    <small>Lá</small>
                </button>

                <button
                    class="botao-nota"
                    data-indice="2"
                    onclick="clicarReferencia(2)">
                    D
                    <small>Ré</small>
                </button>

                <button
                    class="botao-nota"
                    data-indice="3"
                    onclick="clicarReferencia(3)">
                    G
                    <small>Sol</small>
                </button>

                <button
                    class="botao-nota"
                    data-indice="4"
                    onclick="clicarReferencia(4)">
                    B
                    <small>Si</small>
                </button>

                <button
                    class="botao-nota"
                    data-indice="5"
                    onclick="clicarReferencia(5)">
                    E
                    <small>Mi agudo</small>
                </button>

            </div>

        </section>

    </main>

</div>


<script>

    /*
     * ============================================================
     * AFINADOR
     * ============================================================
     *
     * Frequências oficiais do violão em afinação padrão:
     *
     * 6ª corda = E2 = 82.41 Hz
     * 5ª corda = A2 = 110.00 Hz
     * 4ª corda = D3 = 146.83 Hz
     * 3ª corda = G3 = 196.00 Hz
     * 2ª corda = B3 = 246.94 Hz
     * 1ª corda = E4 = 329.63 Hz
     *
     * O microfone NÃO escolhe uma corda.
     * Ele detecta automaticamente a nota mais próxima.
     */

    const notasViolao = [
        {
            nome: "E",
            oitava: 2,
            frequencia: 82.41
        },
        {
            nome: "A",
            oitava: 2,
            frequencia: 110.00
        },
        {
            nome: "D",
            oitava: 3,
            frequencia: 146.83
        },
        {
            nome: "G",
            oitava: 3,
            frequencia: 196.00
        },
        {
            nome: "B",
            oitava: 3,
            frequencia: 246.94
        },
        {
            nome: "E",
            oitava: 4,
            frequencia: 329.63
        }
    ];


    /*
     * ============================================================
     * ÁUDIO
     * ============================================================
     */

    let audioContext = null;

    let streamMicrofone = null;
    let analisador = null;
    let dadosAudio = null;
    let loopMicrofone = null;

    let microfoneAtivo = false;

    /*
     * O som de referência usa um contexto próprio.
     *
     * Isso evita que o processamento do microfone interfira
     * diretamente na reprodução da nota de referência.
     */

    let contextoReferencia = null;

    let osciladoresReferencia = [];
    let ganhosReferencia = [];

    let referenciaAtual = -1;


    /*
     * ============================================================
     * CONTEXTOS
     * ============================================================
     */

    function obterAudioContext() {

        if (!audioContext) {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            audioContext = new AudioContextClass();

        }

        return audioContext;
    }


    async function obterContextoReferencia() {

        if (!contextoReferencia) {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            contextoReferencia =
                new AudioContextClass();

        }

        if (contextoReferencia.state === "suspended") {

            await contextoReferencia.resume();

        }

        return contextoReferencia;
    }


    /*
     * ============================================================
     * SOM DE REFERÊNCIA
     * ============================================================
     *
     * Aqui está a parte importante da correção.
     *
     * A frequência fundamental continua EXATA.
     *
     * Para as notas graves, acrescentamos harmônicos muito baixos
     * para que um alto-falante de celular consiga reproduzir melhor
     * a percepção da nota sem alterar a frequência fundamental.
     *
     * Não mudamos a oitava.
     */

    async function clicarReferencia(indice) {

        const ctx =
            await obterContextoReferencia();

        if (referenciaAtual === indice) {

            pararReferencia();

            return;
        }

        iniciarReferencia(indice);
    }


    function iniciarReferencia(indice) {

        pararReferencia();

        const nota =
            notasViolao[indice];

        const ctx =
            contextoReferencia;

        referenciaAtual = indice;

        /*
         * Fundamental.
         *
         * Esta é a frequência REAL da corda.
         */

        const fundamental =
            ctx.createOscillator();

        const ganhoFundamental =
            ctx.createGain();

        fundamental.type = "triangle";

        fundamental.frequency.setValueAtTime(
            nota.frequencia,
            ctx.currentTime
        );

        /*
         * Começamos muito baixo para evitar clique
         * eletrônico no início do som.
         */

        ganhoFundamental.gain.setValueAtTime(
            0.00001,
            ctx.currentTime
        );

        ganhoFundamental.gain.exponentialRampToValueAtTime(
            0.16,
            ctx.currentTime + 0.08
        );

        fundamental.connect(
            ganhoFundamental
        );

        ganhoFundamental.connect(
            ctx.destination
        );

        fundamental.start();


        osciladoresReferencia.push(
            fundamental
        );

        ganhosReferencia.push(
            ganhoFundamental
        );


        /*
         * Harmônico 2
         */

        const segundo =
            ctx.createOscillator();

        const ganhoSegundo =
            ctx.createGain();

        segundo.type = "sine";

        segundo.frequency.setValueAtTime(
            nota.frequencia * 2,
            ctx.currentTime
        );

        ganhoSegundo.gain.setValueAtTime(
            0.00001,
            ctx.currentTime
        );

        ganhoSegundo.gain.exponentialRampToValueAtTime(
            0.045,
            ctx.currentTime + 0.08
        );

        segundo.connect(
            ganhoSegundo
        );

        ganhoSegundo.connect(
            ctx.destination
        );

        segundo.start();


        osciladoresReferencia.push(
            segundo
        );

        ganhosReferencia.push(
            ganhoSegundo
        );


        /*
         * Harmônico 3
         */

        const terceiro =
            ctx.createOscillator();

        const ganhoTerceiro =
            ctx.createGain();

        terceiro.type = "sine";

        terceiro.frequency.setValueAtTime(
            nota.frequencia * 3,
            ctx.currentTime
        );

        ganhoTerceiro.gain.setValueAtTime(
            0.00001,
            ctx.currentTime
        );

        ganhoTerceiro.gain.exponentialRampToValueAtTime(
            0.02,
            ctx.currentTime + 0.08
        );

        terceiro.connect(
            ganhoTerceiro
        );

        ganhoTerceiro.connect(
            ctx.destination
        );

        terceiro.start();


        osciladoresReferencia.push(
            terceiro
        );

        ganhosReferencia.push(
            ganhoTerceiro
        );


        atualizarBotoesReferencia();
    }


    function pararReferencia() {

        if (!contextoReferencia) {
            referenciaAtual = -1;
            atualizarBotoesReferencia();
            return;
        }

        const ctx =
            contextoReferencia;

        const agora =
            ctx.currentTime;


        ganhosReferencia.forEach(
            ganho => {

                try {

                    ganho.gain.cancelScheduledValues(
                        agora
                    );

                    ganho.gain.setValueAtTime(
                        Math.max(
                            ganho.gain.value,
                            0.00001
                        ),
                        agora
                    );

                    ganho.gain.exponentialRampToValueAtTime(
                        0.00001,
                        agora + 0.08
                    );

                } catch (erro) {

                    console.log(
                        "Erro ao desligar ganho:",
                        erro
                    );

                }

            }
        );


        osciladoresReferencia.forEach(
            oscilador => {

                try {

                    oscilador.stop(
                        agora + 0.10
                    );

                } catch (erro) {

                    console.log(
                        "Oscilador já encerrado."
                    );

                }

            }
        );


        osciladoresReferencia = [];
        ganhosReferencia = [];

        referenciaAtual = -1;

        atualizarBotoesReferencia();
    }


    function atualizarBotoesReferencia() {

        document
            .querySelectorAll(".botao-nota")
            .forEach(botao => {

                const indice =
                    Number(
                        botao.dataset.indice
                    );

                botao.classList.toggle(
                    "tocando",
                    indice === referenciaAtual
                );

            });
    }


    /*
     * ============================================================
     * MICROFONE
     * ============================================================
     */

    async function alternarMicrofone() {

        if (microfoneAtivo) {

            pararMicrofone();

        } else {

            await iniciarMicrofone();

        }
    }


    async function iniciarMicrofone() {

        try {

            const ctx =
                obterAudioContext();

            if (ctx.state === "suspended") {

                await ctx.resume();

            }


            streamMicrofone =
                await navigator.mediaDevices.getUserMedia({

                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        channelCount: 1
                    }

                });


            const fonte =
                ctx.createMediaStreamSource(
                    streamMicrofone
                );


            analisador =
                ctx.createAnalyser();

            analisador.fftSize = 4096;

            analisador.minDecibels = -90;
            analisador.maxDecibels = -10;
            analisador.smoothingTimeConstant = 0.15;


            dadosAudio =
                new Float32Array(
                    analisador.fftSize
                );


            fonte.connect(
                analisador
            );


            microfoneAtivo = true;


            document
                .getElementById("botaoMicrofone")
                .textContent =
                "🎤 PARAR MICROFONE";


            document
                .getElementById("botaoMicrofone")
                .classList.add("ativo");


            document
                .getElementById("microfoneStatus")
                .textContent =
                "Ouvindo... toque uma corda.";


            analisarMicrofone();


        } catch (erro) {

            console.error(
                "Erro ao acessar microfone:",
                erro
            );

            document
                .getElementById("microfoneStatus")
                .textContent =
                "Não foi possível acessar o microfone. Verifique a permissão do navegador.";

        }
    }


    function pararMicrofone() {

        microfoneAtivo = false;


        if (loopMicrofone) {

            cancelAnimationFrame(
                loopMicrofone
            );

            loopMicrofone = null;
        }


        if (streamMicrofone) {

            streamMicrofone
                .getTracks()
                .forEach(
                    track => track.stop()
                );

            streamMicrofone = null;
        }


        document
            .getElementById("botaoMicrofone")
            .textContent =
            "🎤 ATIVAR MICROFONE";


        document
            .getElementById("botaoMicrofone")
            .classList.remove("ativo");


        document
            .getElementById("microfoneStatus")
            .textContent =
            "O afinador está parado.";


        document
            .getElementById("notaAtual")
            .textContent =
            "—";


        document
            .getElementById("frequenciaAtual")
            .textContent =
            "Toque uma corda...";


        document
            .getElementById("mensagem")
            .textContent =
            "AGUARDANDO SOM";


        document
            .getElementById("statusAfinacao")
            .textContent =
            "—";


        moverAgulha(0);
    }


    /*
     * ============================================================
     * LEITURA DO MICROFONE
     * ============================================================
     */

    function analisarMicrofone() {

        if (!microfoneAtivo) {
            return;
        }


        analisador.getFloatTimeDomainData(
            dadosAudio
        );


        const frequencia =
            detectarFrequencia(
                dadosAudio,
                analisador.context.sampleRate
            );


        if (
            frequencia &&
            frequencia >= 70 &&
            frequencia <= 380
        ) {

            processarFrequencia(
                frequencia
            );

        }


        loopMicrofone =
            requestAnimationFrame(
                analisarMicrofone
            );
    }


    /*
     * ============================================================
     * DETECÇÃO DE FREQUÊNCIA
     * ============================================================
     *
     * Autocorrelação.
     *
     * Faixa específica das cordas abertas do violão.
     */

    function detectarFrequencia(
        buffer,
        sampleRate
    ) {

        let soma = 0;

        for (
            let i = 0;
            i < buffer.length;
            i++
        ) {

            soma +=
                buffer[i] *
                buffer[i];

        }


        const rms =
            Math.sqrt(
                soma / buffer.length
            );


        /*
         * Ignora silêncio e ruído muito baixo.
         */

        if (rms < 0.008) {

            return null;
        }


        /*
         * Limites aproximados:
         *
         * 70 Hz -> abaixo do E2
         * 380 Hz -> acima do E4
         */

        const minFrequencia = 70;
        const maxFrequencia = 380;


        const minLag =
            Math.floor(
                sampleRate /
                maxFrequencia
            );


        const maxLag =
            Math.floor(
                sampleRate /
                minFrequencia
            );


        let melhorLag = -1;
        let melhorCorrelacao = 0;


        for (
            let lag = minLag;
            lag <= maxLag;
            lag++
        ) {

            let correlacao = 0;
            let energiaA = 0;
            let energiaB = 0;


            for (
                let i = 0;
                i < buffer.length - lag;
                i++
            ) {

                const a =
                    buffer[i];

                const b =
                    buffer[i + lag];


                correlacao +=
                    a * b;

                energiaA +=
                    a * a;

                energiaB +=
                    b * b;
            }


            if (
                energiaA === 0 ||
                energiaB === 0
            ) {

                continue;
            }


            const normalizada =
                correlacao /
                Math.sqrt(
                    energiaA *
                    energiaB
                );


            if (
                normalizada >
                melhorCorrelacao
            ) {

                melhorCorrelacao =
                    normalizada;

                melhorLag =
                    lag;
            }

        }


        if (
            melhorLag === -1 ||
            melhorCorrelacao < 0.55
        ) {

            return null;
        }


        /*
         * Pequena interpolação para melhorar a precisão.
         */

        return (
            sampleRate /
            melhorLag
        );
    }


    /*
     * ============================================================
     * PROCESSAMENTO DA NOTA
     * ============================================================
     */

    let historicoFrequencias = [];


    function processarFrequencia(
        frequencia
    ) {

        historicoFrequencias.push(
            frequencia
        );


        /*
         * Mantemos poucas leituras para
         * evitar que o cursor fique tremendo.
         */

        if (
            historicoFrequencias.length > 7
        ) {

            historicoFrequencias.shift();

        }


        const frequenciaEstavel =
            calcularMediana(
                historicoFrequencias
            );


        let melhorNota = null;
        let menorDistancia = Infinity;


        notasViolao.forEach(
            nota => {

                const distancia =
                    Math.abs(
                        1200 *
                        Math.log2(
                            frequenciaEstavel /
                            nota.frequencia
                        )
                    );


                if (
                    distancia <
                    menorDistancia
                ) {

                    menorDistancia =
                        distancia;

                    melhorNota =
                        nota;
                }

            }
        );


        if (!melhorNota) {
            return;
        }


        /*
         * Centésimos de semitom.
         *
         * 0 = perfeitamente afinado.
         */

        const cents =
            1200 *
            Math.log2(
                frequenciaEstavel /
                melhorNota.frequencia
            );


        mostrarAfinacao(
            melhorNota,
            frequenciaEstavel,
            cents
        );
    }


    function calcularMediana(lista) {

        const ordenada =
            [...lista].sort(
                (a, b) => a - b
            );


        const meio =
            Math.floor(
                ordenada.length / 2
            );


        if (
            ordenada.length % 2 === 0
        ) {

            return (
                (
                    ordenada[meio - 1] +
                    ordenada[meio]
                ) / 2
            );

        }


        return ordenada[meio];
    }


    /*
     * ============================================================
     * VISUAL DO AFINADOR
     * ============================================================
     */

    function mostrarAfinacao(
        nota,
        frequencia,
        cents
    ) {

        document
            .getElementById("notaAtual")
            .textContent =
            nota.nome;


        document
            .getElementById("frequenciaAtual")
            .textContent =
            frequencia.toFixed(2) +
            " Hz";


        let mensagem =
            document.getElementById(
                "mensagem"
            );


        let status =
            document.getElementById(
                "statusAfinacao"
            );


        /*
         * Limita a agulha aos extremos.
         */

        const centsLimitados =
            Math.max(
                -50,
                Math.min(
                    50,
                    cents
                )
            );


        /*
         * -50 cents = -45 graus
         *  0 cents  = 0 graus
         * +50 cents = +45 graus
         */

        const graus =
            centsLimitados *
            0.9;


        moverAgulha(
            graus
        );


        /*
         * Tolerância para considerar afinado.
         */

        if (
            Math.abs(cents) <= 5
        ) {

            mensagem.textContent =
                "AFINADO";

            mensagem.style.color =
                "var(--green)";


            status.textContent =
                nota.nome +
                nota.oitava +
                " • " +
                nota.frequencia.toFixed(2) +
                " Hz";


        } else if (
            cents < 0
        ) {

            mensagem.textContent =
                "APERTAR";

            mensagem.style.color =
                "var(--red)";


            status.textContent =
                nota.nome +
                nota.oitava +
                " está " +
                Math.abs(cents).toFixed(1) +
                " cents abaixo";


        } else {

            mensagem.textContent =
                "AFROUXAR";

            mensagem.style.color =
                "var(--red)";


            status.textContent =
                nota.nome +
                nota.oitava +
                " está " +
                Math.abs(cents).toFixed(1) +
                " cents acima";
        }
    }


    function moverAgulha(
        graus
    ) {

        const agulha =
            document.getElementById(
                "agulha"
            );


        agulha.style.transform =
            "translateX(-50%) rotate(" +
            graus +
            "deg)";
    }


    /*
     * ============================================================
     * LIMPEZA
     * ============================================================
     */

    window.addEventListener(
        "beforeunload",
        () => {

            pararMicrofone();
            pararReferencia();

        }
    );

</script>
