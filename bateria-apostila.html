<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostila VIP - Bateria (E-book)</title>
    
    <!-- PDF.js para renderizar o PDF diretamente no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #000000;
            padding: 12px 20px;
            border-bottom: 1px solid #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        header h1 {
            font-size: 1.1rem;
            color: #fff;
            flex: 1;
            text-align: center;
        }
        .btn-voltar {
            background-color: #242424;
            color: #fff;
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-voltar:hover {
            background-color: #2a2a2a;
            transform: scale(1.02);
        }
        .header-spacer {
            width: 70px; 
        }

        /* Layout Principal do E-book */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            background: #121212;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Menu Lateral (Índice / Marcadores / Pesquisa) */
        .sidebar {
            width: 320px;
            background-color: #181818;
            border-right: 1px solid #282828;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            height: 100%;
        }

        .sidebar-title {
            font-size: 1.05rem;
            color: #fff;
            font-weight: bold;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 20px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: #1db954;
        }

        .bookmarks-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .bookmark-item {
            background-color: #202020;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-item:hover {
            background-color: #282828;
            color: #fff;
            border-left-color: #1db954;
        }

        /* Área do Livro / E-book */
        .book-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, #252525 0%, #121212 100%);
            padding: 20px;
            overflow: hidden;
        }

        /* Efeito visual de Caderno / Livro */
        .book-page-container {
            background-color: #f4f1ea; /* Tom clássico de folha de livro */
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            max-height: 75vh;
            overflow: hidden;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto !important;
            max-height: 70vh;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border-radius: 2px;
        }

        /* Barra de Controle de Páginas Inferior */
        .book-footer-bar {
            position: absolute;
            bottom: 15px;
            background-color: rgba(18, 18, 18, 0.95);
            border: 1px solid #333;
            padding: 8px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .book-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .book-btn:hover:not(:disabled) {
            background-color: #1db954;
            border-color: #1db954;
            color: #000;
            transform: scale(1.05);
        }

        .book-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-indicator {
            font-size: 0.85rem;
            color: #fff;
            font-weight: bold;
        }

        /* Responsividade para Celulares */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                height: 160px;
                min-height: 160px;
            }
            .book-viewport {
                height: calc(100vh - 220px);
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="bateria-vip.html" class="btn-voltar">&#8592; Voltar</a>
        <h1>Apostila VIP - Carlos Richless</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="main-container">
        <!-- Menu Lateral com Pesquisa e Marcadores (Índice do PDF) -->
        <div class="sidebar">
            <div class="sidebar-title">Índice da Apostila</div>
            <div class="search-box">
                <input type="text" id="searchBookmark" placeholder="Pesquisar exercício...">
            </div>
            <div class="bookmarks-container" id="bookmarksList">
                <div class="bookmark-item" style="color: #777; text-align: center;">Carregando marcadores...</div>
            </div>
        </div>

        <!-- Visualizador do E-book (Folheador Horizontal) -->
        <div class="book-viewport">
            <div class="book-page-container" id="pageContainer">
                <canvas id="pdfCanvas"></canvas>
            </div>

            <!-- Controles de Página -->
            <div class="book-footer-bar">
                <button class="book-btn" id="prevPage">&#10094; Anterior</button>
                <span class="page-indicator" id="pageIndicator">Página 0 / 0</span>
                <button class="book-btn" id="nextPage">Próxima &#10095;</button>
            </div>
        </div>
    </div>

    <script>
        // Link direto do repositório apostila-vip no GitHub Pages
        const urlPdf = "https://carlosrichless.github.io/apostila-vip/APOSTILA%20DE%20AULAS%20DE%20BATERIA%20VOL1%20C.RICHLESS%202%C2%AA%20EDI%C3%87%C3%83O%20REVISTA%20E%20ATUALIZADA%202026.pdf";

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.25;
        let pdfOutlines = [];

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const pageIndicator = document.getElementById('pageIndicator');
        const bookmarksList = document.getElementById('bookmarksList');
        const searchInput = document.getElementById('searchBookmark');
        const pageContainer = document.getElementById('pageContainer');

        // Carregar o PDF usando o PDF.js
        pdfjsLib.getDocument(urlPdf).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            pageIndicator.textContent = `Página ${pageNum} / ${pdfDoc.numPages}`;
            
            renderPage(pageNum);

            // Carregar os marcadores (outline / índice interno do PDF)
            pdfDoc.getOutline().then(function(outline) {
                pdfOutlines = outline || [];
                exibirMarcadores(pdfOutlines);
            }).catch(function() {
                bookmarksList.innerHTML = '<div class="bookmark-item" style="color:#777;">Nenhum índice interno encontrado.</div>';
            });
        }).catch(function(error) {
            console.error(error);
            bookmarksList.innerHTML = '<div class="bookmark-item" style="color:#ff5555;">Erro ao carregar PDF.</div>';
        });

        // Função para renderizar a página com efeito de virada horizontal
        function renderPage(num) {
            pageRendering = true;
            
            pageContainer.style.transform = "scale(0.97)";
            pageContainer.style.opacity = "0.6";

            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                const renderTask = page.render(renderContext);
                renderTask.promise.then(function() {
                    pageRendering = false;
                    pageIndicator.textContent = `Página ${pageNum} / ${pdfDoc.numPages}`;
                    
                    setTimeout(() => {
                        pageContainer.style.transform = "scale(1)";
                        pageContainer.style.opacity = "1";
                    }, 80);

                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        document.getElementById('prevPage').addEventListener('click', onPrevPage);
        document.getElementById('nextPage').addEventListener('click', onNextPage);

        // Navegação por teclado (Setas Esquerda / Direita)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') onPrevPage();
            if (e.key === 'ArrowRight') onNextPage();
        });

        // Função para processar e exibir os marcadores na barra lateral com suporte a busca
        function exibirMarcadores(outlines, filtro = '') {
            bookmarksList.innerHTML = '';
            
            if (!outlines || outlines.length === 0) {
                bookmarksList.innerHTML = '<div class="bookmark-item" style="color:#777;">Sem marcadores no PDF.</div>';
                return;
            }

            let contador = 0;
            outlines.forEach(item => {
                if (filtro && !item.title.toLowerCase().includes(filtro.toLowerCase())) return;

                contador++;
                const div = document.createElement('div');
                div.className = 'bookmark-item';
                div.textContent = item.title;
                
                div.addEventListener('click', () => {
                    if (item.dest) {
                        pdfDoc.getDestination(item.dest).then(destination => {
                            if (destination) {
                                pdfDoc.getPageIndex(destination[0]).then(index => {
                                    pageNum = index + 1;
                                    queueRenderPage(pageNum);
                                });
                            }
                        });
                    }
                });
                bookmarksList.appendChild(div);
            });

            if (contador === 0) {
                bookmarksList.innerHTML = '<div class="bookmark-item" style="color:#777;">Nenhum exercício encontrado.</div>';
            }
        }

        // Caixa de Pesquisa em tempo real
        searchInput.addEventListener('input', (e) => {
            exibirMarcadores(pdfOutlines, e.target.value);
        });
    </script>
</body>
</html>
