<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostila VIP - Bateria (E-book)</title>
    
    <!-- PDF.js para renderizar o PDF diretamente no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #000000;
            padding: 10px 20px;
            border-bottom: 1px solid #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 55px;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1rem;
            color: #fff;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-voltar {
            background-color: #242424;
            color: #fff;
            padding: 6px 12px;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-voltar:hover {
            background-color: #2a2a2a;
        }
        .header-spacer {
            width: 60px; 
        }

        /* Layout Principal do E-book */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            background: #121212;
            height: calc(100vh - 55px);
            overflow: hidden;
        }

        /* Menu Lateral (Índice / Marcadores / Pesquisa) */
        .sidebar {
            width: 300px;
            background-color: #181818;
            border-right: 1px solid #282828;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            height: 100%;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 0.95rem;
            color: #fff;
            font-weight: bold;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 20px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }
        .search-box input:focus {
            border-color: #1db954;
        }

        .bookmarks-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 4px;
        }

        .bookmark-item {
            background-color: #202020;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-item:hover {
            background-color: #282828;
            color: #fff;
            border-left-color: #1db954;
        }

        /* Área do Livro / E-book */
        .book-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, #252525 0%, #121212 100%);
            padding: 15px;
            overflow: hidden;
            touch-action: pan-y; /* Permite scroll vertical se necessário, mas deixa horizontal livre */
        }

        .book-page-container {
            background-color: #f4f1ea;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            max-height: 72vh;
            max-width: 100%;
            overflow: hidden;
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: grab;
        }
        .book-page-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto !important;
            max-height: 68vh;
            border-radius: 2px;
            pointer-events: none; /* Garante que o evento de arrastar pegue no container */
        }

        /* Barra de Controle de Páginas Inferior */
        .book-footer-bar {
            position: absolute;
            bottom: 12px;
            background-color: rgba(18, 18, 18, 0.95);
            border: 1px solid #333;
            padding: 6px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .book-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .book-btn:hover:not(:disabled) {
            background-color: #1db954;
            border-color: #1db954;
            color: #000;
        }

        .book-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-indicator {
            font-size: 0.8rem;
            color: #fff;
            font-weight: bold;
        }

        /* Botão de Tela Cheia Flutuante */
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            z-index: 20;
            transition: background 0.2s;
        }
        .fullscreen-btn:hover {
            background: #1db954;
            color: #000;
            border-color: #1db954;
        }

        /* Responsividade para Celulares (Empilhado e proporcional) */
        @media (max-width: 768px) {
            body {
                height: 100vh;
                overflow: auto;
            }
            .main-container {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 55px);
            }
            .sidebar {
                width: 100%;
                height: 130px;
                min-height: 130px;
                max-height: 130px;
            }
            .book-viewport {
                height: calc(100vh - 185px);
                min-height: 400px;
                padding: 10px;
            }
            .book-page-container {
                max-height: 62vh;
            }
            canvas {
                max-height: 58vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="bateria-vip.html" class="btn-voltar">&#8592; Voltar</a>
        <h1>Apostila VIP - Carlos Richless</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="main-container">
        <!-- Menu Lateral com Pesquisa e Marcadores -->
        <div class="sidebar">
            <div class="sidebar-title">Índice da Apostila</div>
            <div class="search-box">
                <input type="text" id="searchBookmark" placeholder="Pesquisar exercício...">
            </div>
            <div class="bookmarks-container" id="bookmarksList">
                <div class="bookmark-item" style="color: #777; text-align: center;">Carregando marcadores...</div>
            </div>
        </div>

        <!-- Visualizador do E-book -->
        <div class="book-viewport" id="bookViewport">
            <button class="fullscreen-btn" id="fullscreenBtn" title="Tela Cheia">⛶ Tela Cheia</button>
            
            <div class="book-page-container" id="pageContainer">
                <canvas id="pdfCanvas"></canvas>
            </div>

            <!-- Controles de Página -->
            <div class="book-footer-bar">
                <button class="book-btn" id="prevPage">&#10094; Anterior</button>
                <span class="page-indicator" id="pageIndicator">Página 0 / 0</span>
                <button class="book-btn" id="nextPage">Próxima &#10095;</button>
            </div>
        </div>
    </div>

    <script>
        const urlPdf = "https://carlosrichless.github.io/apostila-vip/APOSTILA%20DE%20AULAS%20DE%20BATERIA%20VOL1%20C.RICHLESS%202%C2%AA%20EDI%C3%87%C3%83O%20REVISTA%20E%20ATUALIZADA%202026.pdf";

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.25;
        let pdfOutlines = [];

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const pageIndicator = document.getElementById('pageIndicator');
        const bookmarksList = document.getElementById('bookmarksList');
        const searchInput = document.getElementById('searchBookmark');
        const pageContainer = document.getElementById('pageContainer');
        const bookViewport = document.getElementById('bookViewport');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // Carregar o PDF
        pdfjsLib.getDocument(urlPdf).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            pageIndicator.textContent = `Página ${pageNum} / ${pdfDoc.numPages}`;
            renderPage(pageNum);

            // Carregar o Índice / Marcadores
            pdfDoc.getOutline().then(function(outline) {
                pdfOutlines = outline || [];
                exibirMarcadores(pdfOutlines);
            }).catch(function() {
                bookmarksList.innerHTML = '<div class="bookmark-item" style="color:#777;">Nenhum índice interno encontrado.</div>';
            });
        }).catch(function(error) {
            console.error(error);
            bookmarksList.innerHTML = '<div class="bookmark-item" style="color:#ff5555;">Erro ao carregar PDF.</div>';
        });

        function renderPage(num) {
            pageRendering = true;
            pageContainer.style.transform = "scale(0.97)";
            pageContainer.style.opacity = "0.5";

            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                page.render(renderContext).promise.then(function() {
                    pageRendering = false;
                    pageIndicator.textContent = `Página ${pageNum} / ${pdfDoc.numPages}`;
                    
                    setTimeout(() => {
                        pageContainer.style.transform = "scale(1)";
                        pageContainer.style.opacity = "1";
                    }, 50);

                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        document.getElementById('prevPage').addEventListener('click', onPrevPage);
        document.getElementById('nextPage').addEventListener('click', onNextPage);

        // Navegação por teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') onPrevPage();
            if (e.key === 'ArrowRight') onNextPage();
        });

        // Suporte a Arrastar Horizontalmente (Swipe / Mouse Drag)
        let touchStartX = 0;
        let touchEndX = 0;

        pageContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        pageContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            tratarSwipe();
        }, { passive: true });

        pageContainer.addEventListener('mousedown', (e) => {
            touchStartX = e.clientX;
        });

        pageContainer.addEventListener('mouseup', (e) => {
            touchEndX = e.clientX;
            tratarSwipe();
        });

        function tratarSwipe() {
            let limiteSwipe = 50; // Distância mínima para considerar o gesto
            if (touchEndX < touchStartX - limiteSwipe) {
                onNextPage(); // Arrastou para a esquerda -> Próxima página
            }
            if (touchEndX > touchStartX + limiteSwipe) {
                onPrevPage(); // Arrastou para a direita -> Página anterior
            }
        }

        // Função de Tela Cheia
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                bookViewport.requestFullscreen().catch(err => {
                    alert(`Erro ao tentar modo tela cheia: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = "⤹ Sair da Tela Cheia";
            } else {
                fullscreenBtn.textContent = "⛶ Tela Cheia";
            }
        });

        // Exibir e tratar clique nos marcadores com precisão absoluta
        function exibirMarcadores(outlines, filtro = '') {
            bookmarksList.innerHTML = '';
            
            if (!outlines || outlines.length === 0) {
                bookmarksList.innerHTML = '<div class="bookmark-item" style="color:#777;">Sem marcadores no PDF.</div>';
                return;
            }

            let contador = 0;
            outlines.forEach(item => {
                if (filtro && !item.title.toLowerCase().includes(filtro.toLowerCase())) return;

                contador++;
                const div = document.createElement('div');
                div.className = 'bookmark-item';
                div.textContent = item.title;
                
                div.addEventListener('click', () => {
                    if (item.dest) {
                        pdfDoc.getDestination(item.dest).then(destination => {
                            if (destination) {
                                pdfDoc.getPageIndex(destination[0]).then(index => {
                                    pageNum = index + 1;
                                    queueRenderPage(pageNum);
                                });
                            }
                        }).catch(() => {
                            // Fallback caso o formato venha direto como string de nome
                            pdfDoc.getPageIndex(item.dest).then(index => {
                                pageNum = index + 1;
                                queueRenderPage(pageNum);
                            }).catch(err => console.error("Erro ao navegar para o marcador:", err));
                        });
                    }
                });
                bookmarksList.appendChild(div);
            });

            if (contador === 0) {
                bookmarksList.innerHTML = '<div class="bookmark-item" style="color:#777;">Nenhum exercício encontrado.</div>';
            }
        }

        searchInput.addEventListener('input', (e) => {
            exibirMarcadores(pdfOutlines, e.target.value);
        });
    </script>
</body>
</html>
