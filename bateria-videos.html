<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos Explicativos | C. Richless</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #34d399;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Barra Superior Padronizada */
        .top-bar {
            background-color: #1e293b;
            border-bottom: 1px solid var(--border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-title { color: var(--text-main); font-size: 1rem; font-weight: 600; }
        .btn-voltar {
            background: #2563eb;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-voltar:hover { background: #1d4ed8; }

        /* Container Principal */
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            flex-grow: 1;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            color: var(--success);
            font-size: 1.8rem;
        }
        .search-box {
            width: 100%;
            padding: 12px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 25px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }

        /* Cards de Vídeo */
        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .video-card h3 {
            color: var(--accent);
            font-size: 1rem;
            margin-bottom: 12px;
        }
        video {
            width: 100%;
            border-radius: 6px;
            outline: none;
            background: #000;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="top-bar">
        <div class="top-title">🎬 Vídeos Explicativos das Aulas</div>
        <a href="bateria-vip.html" class="btn-voltar">← Voltar à Área VIP</a>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Vídeos da Apostila</h1>
        </div>

        <!-- Campo de busca para achar rápido qualquer vídeo pelo número ou nome -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Pesquisar aula (ex: 10, Levadas, 45...)" onkeyup="filtrarVideos()">

        <!-- Lista onde os vídeos serão injetados automaticamente -->
        <div id="lista-videos"></div>
    </div>

    <footer>
        Projeto Academia de Música - C. Richless &copy; 2026
    </footer>

    <script>
        // Lista com os nomes exatos dos seus arquivos de vídeo em ordem numérica correta.
        // Basta adicionar novos nomes aqui se precisar expandir no futuro!
        const arquivosVideos = [
            "1 - ABERTURA", // Exemplo genérico caso tenha o 1
            "10 - LEVADAS",
            "11 - LEVADAS COLCHEIA",
            // Insira os outros nomes na ordem exata aqui, ou o script gerará pelo padrão abaixo:
        ];

        // Se você preferir gerar de forma totalmente automatizada de 1 até 83 (ajuste o número máximo se precisar):
        // (Caso seus arquivos sigam o padrão exato de nomenclatura numérica no GitHub)
        const totalVideos = 83; 
        const container = document.getElementById('lista-videos');

        function carregarVideos() {
            let html = '';
            // Se quiser usar a lista manual preenchida acima, mude para: arquivosVideos
            // Caso queira gerar de 1 a 83 de forma automática:
            for (let i = 1; i <= totalVideos; i++) {
                // Monta o nome base correspondente (ajuste conforme o prefixo que você usa nos arquivos)
                // Exemplo: se seus arquivos se chamam "1 - NOME.mp4", "2 - NOME.mp4", etc.
                let nomeExibicao = `Aula de Bateria - Vídeo ${i}`;
                let nomeArquivo = `${i}%20-%20AULA.mp4`; // Ajuste o sufixo se necessário

                // Tratamento especial para os vídeos que já sabemos que existem com nomes específicos:
                if (i === 10) { nomeExibicao = "10 - LEVADAS"; nomeArquivo = "10%20-%20LEVADAS.mp4"; }
                if (i === 11) { nomeExibicao = "11 - LEVADAS COLCHEIA"; nomeArquivo = "11%20-%20LEVADAS%20COLCHEIA.mp4"; }
                if (i === 100) { nomeExibicao = "100 - OUTRAS LEVADAS 6 POR 9"; nomeArquivo = "100%20-%20OUTRAS%20LEVADAS%206%20POR%209.mp4"; }
                if (i === 101) { nomeExibicao = "101 - OUTRAS LEVADAS E NOTAS FANTASMAS"; nomeArquivo = "101%20-%20OUTRAS%20LEVADAS%20E%20NOTAS%20FANTASMAS.mp4"; }

                html += `
                    <div class="video-card" data-titulo="${nomeExibicao.toLowerCase()}">
                        <h3>${nomeExibicao}</h3>
                        <video controls controlsList="nodownload" preload="metadata">
                            <source src="https://carlosrichless.github.io/bateria-arquivos-videovip/${nomeArquivo}" type="video/mp4">
                            Seu navegador não suporta vídeo.
                        </video>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // Função de busca instantânea
        function filtrarVideos() {
            let termo = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.video-card');
            cards.forEach(card => {
                let titulo = card.getAttribute('data-titulo');
                if (titulo.includes(termo)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Executa ao carregar a página
        window.onload = carregarVideos;
    </script>
</body>
</html>
