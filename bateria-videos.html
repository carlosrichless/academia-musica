<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos Explicativos | C. Richless</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #34d399;
            --hover-bg: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .top-bar {
            background-color: #1e293b;
            border-bottom: 1px solid var(--border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-title { color: var(--text-main); font-size: 1rem; font-weight: 600; }
        .btn-voltar {
            background: #2563eb;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-voltar:hover { background: #1d4ed8; }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            flex-grow: 1;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            color: var(--success);
            font-size: 1.8rem;
        }
        .search-box {
            width: 100%;
            padding: 12px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 25px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }

        /* Área do Player Principal */
        .player-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none; /* Só aparece quando clica em um vídeo */
        }
        .player-container h3 {
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            border-radius: 6px;
            outline: none;
            background: #000;
        }

        /* Lista de Links Estilo Menu */
        .lista-menu {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .item-video {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
        }
        .item-video:last-child { border-bottom: none; }
        .item-video:hover { background-color: var(--hover-bg); color: var(--accent); }
        .item-video span { font-weight: 500; }
        .item-video .icone-play { font-size: 1.1rem; color: var(--accent); }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-title">🎬 Vídeos Explicativos das Aulas</div>
        <a href="bateria-vip.html" class="btn-voltar">← Voltar à Área VIP</a>

        ];

        const containerMenu = document.getElementById('listaVideosMenu');

        function carregarLista() {
            let html = '';
            listaNomesVideos.forEach(nomeArquivo => {
                let tituloExibicao = nomeArquivo.replace('.mp4', '');
                let urlArquivo = encodeURI(nomeArquivo);

                html += `
                    <div class="item-video" data-titulo="${tituloExibicao.toLowerCase()}" onclick="tocarVideo('${urlArquivo}', '${tituloExibicao}')">
                        <span>🎵 ${tituloExibicao}</span>
                        <span class="icone-play">▶</span>
                    </div>
                `;
            });
            containerMenu.innerHTML = html;
        }

        function tocarVideo(urlArquivo, titulo) {
            const playerContainer = document.getElementById('playerContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoTitleActive = document.getElementById('videoTitleActive');

            videoTitleActive.innerText = titulo;
            videoPlayer.src = `https://carlosrichless.github.io/bateria-arquivos-videovip/${urlArquivo}`;
            playerContainer.style.display = 'block';
            
            // Racha a página suavemente para o player topo
            playerContainer.scrollIntoView({ behavior: 'smooth' });
            
            videoPlayer.play();
        }

        function filtrarVideos() {
            let termo = document.getElementById('searchInput').value.toLowerCase();
            let itens = document.querySelectorAll('.item-video');
            itens.forEach(item => {
                let titulo = item.getAttribute('data-titulo');
                if (titulo.includes(termo)) {
                    item.style.display = "flex";
                } else {
                    item.style.display = "none";
                }
            });
        }

        window.onload = carregarLista;
