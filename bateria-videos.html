<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Vídeos VIP - Bateria</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.2rem;
            color: #fff;
            flex: 1;
            text-align: center;
        }
        /* Estilo do botão de voltar */
        .btn-voltar {
            background-color: #2a2a2a;
            color: #fff;
            padding: 8px 14px;
            border: 1px solid #444;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-voltar:hover {
            background-color: #333;
            border-color: #1db954;
        }
        /* Espaçador invisível para equilibrar o header centralizado */
        .header-spacer {
            width: 90px; 
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .player-area {
            flex: 2;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        video {
            width: 100%;
            max-height: 75vh;
            outline: none;
            background: #000;
        }
        .video-title {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #fff;
            text-align: center;
        }
        .playlist-area {
            flex: 1;
            background-color: #181818;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            max-width: 400px;
        }
        .playlist-header {
            padding: 15px;
            background-color: #202020;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        /* Estilo da barra de pesquisa */
        .search-box {
            padding: 10px 15px;
            background-color: #181818;
            border-bottom: 1px solid #333;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .search-box input:focus {
            border-color: #1db954;
        }
        .playlist {
            overflow-y: auto;
            flex: 1;
        }
        .playlist-item {
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        .playlist-item:hover {
            background-color: #2a2a2a;
        }
        .playlist-item.active {
            background-color: #333;
            border-left: 4px solid #1db954;
            color: #fff;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .playlist-area {
                max-width: 100%;
                max-height: 40vh;
            }
            video {
                max-height: 40vh;
            }
            header {
                padding: 10px 15px;
            }
            header h1 {
                font-size: 1rem;
            }
            .btn-voltar {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
            .header-spacer {
                width: 60px;
            }
        }
    </style>
</head>
<body>

        <!-- Botão de Voltar (Altere o href para o link correto do seu módulo ou página anterior, ex: index.html) -->
        <a href="bateria-vip.html" class="btn-voltar">&#8592; Voltar5BBateria%vip</a>

            "98 - OUTRAS LEVADAS SHUFFLE.mp4",
            "99 - OUTRAS LEVADAS 3 POR 4 + SHUFFLE.mp4"
        ];

        const videoPlayer = document.getElementById('videoPlayer');
        const videoTitle = document.getElementById('videoTitle');
        const playlistContainer = document.getElementById('playlist');
        const searchInput = document.getElementById('searchInput');

        function carregarPlaylist(filtro = '') {
            playlistContainer.innerHTML = '';
            
            videos.forEach((filename) => {
                const nomeLimpo = filename.replace('.mp4', '');
                
                if (nomeLimpo.toLowerCase().includes(filtro.toLowerCase())) {
                    const item = document.createElement('div');
                    item.className = 'playlist-item';
                    item.textContent = nomeLimpo;
                    
                    if (videoPlayer.src.includes(encodeURIComponent(filename))) {
                        item.classList.add('active');
                    }
                    
                    item.addEventListener('click', () => {
                        trocarVideo(filename, item);
                    });

                    playlistContainer.appendChild(item);
                }
            });
        }

        function trocarVideo(filename, elementoItem) {
            document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
            if (elementoItem) {
                elementoItem.classList.add('active');
            }

            const videoUrl = baseUrl + encodeURIComponent(filename);

            videoPlayer.src = videoUrl;
            videoTitle.textContent = filename.replace('.mp4', '');
            videoPlayer.play().catch(e => {
                console.log("Reprodução automática bloqueada pelo navegador ou erro ao carregar:", e);
            });
        }

        searchInput.addEventListener('input', (e) => {
            carregarPlaylist(e.target.value);
        });

        carregarPlaylist();
        if (videos.length > 0) {
            trocarVideo(videos[0], null);
        }
