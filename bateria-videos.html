<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Vídeos VIP - Bateria</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        header h1 {
            font-size: 1.2rem;
            color: #fff;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .player-area {
            flex: 2;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        video {
            width: 100%;
            max-height: 75vh;
            outline: none;
            background: #000;
        }
        .video-title {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #fff;
            text-align: center;
        }
        .playlist-area {
            flex: 1;
            background-color: #181818;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            max-width: 400px;
        }
        .playlist-header {
            padding: 15px;
            background-color: #202020;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        .playlist {
            overflow-y: auto;
            flex: 1;
        }
        .playlist-item {
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        .playlist-item:hover {
            background-color: #2a2a2a;
        }
        .playlist-item.active {
            background-color: #333;
            border-left: 4px solid #1db954;
            color: #fff;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .playlist-area {
                max-width: 100%;
                max-height: 40vh;
            }
            video {
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Biblioteca VIP - Carlos Richless</h1>
    </header>

    <div class="container">
        <!-- Área do Player -->
        <div class="player-area">
            <video id="videoPlayer" controls autoplay>
                Seu navegador não suporta reprodução de vídeo.
            </video>
            <div class="video-title" id="videoTitle">Selecione um vídeo ao lado</div>
        </div>

        <!-- Lista de Vídeos -->
        <div class="playlist-area">
            <div class="playlist-header">Aulas Disponíveis</div>
            <div class="playlist" id="playlist">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>
    </div>

            "97 - OUTRAS LEVADAS.mp4",
            "98 - OUTRAS LEVADAS SHUFFLE.mp4",
            "99 - OUTRAS LEVADAS 3 POR 4 + SHUFFLE.mp4"
        ];

        const videoPlayer = document.getElementById('videoPlayer');
        const videoTitle = document.getElementById('videoTitle');
        const playlistContainer = document.getElementById('playlist');

        function carregarPlaylist() {
            playlistContainer.innerHTML = '';
            videos.forEach((filename, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                // Remove a extensão .mp4 na exibição da lista para ficar mais limpo
                item.textContent = filename.replace('.mp4', '');
                
                item.addEventListener('click', () => {
                    trocarVideo(index, item);
                });

                playlistContainer.appendChild(item);
            });

            // Carrega o primeiro vídeo por padrão ao abrir a página
            if (videos.length > 0) {
                const primeiroItem = playlistContainer.children[0];
                trocarVideo(0, primeiroItem);
            }
        }

        function trocarVideo(index, elementoItem) {
            // Remove a classe active de todos
            document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
            // Adiciona no atual
            elementoItem.classList.add('active');

            const filename = videos[index];
            // Codifica corretamente os espaços e acentos para a URL do navegador
            const videoUrl = baseUrl + encodeURIComponent(filename);

            videoPlayer.src = videoUrl;
            videoTitle.textContent = filename.replace('.mp4', '');
            videoPlayer.play().catch(e => {
                console.log("Reprodução automática bloqueada pelo navegador ou erro ao carregar:", e);
            });
        }

        // Inicializa a playlist ao carregar a página
        carregarPlaylist();
    </script>
</body>
</html>
