        let todosOsPlayers = [];

        // Cria os blocos de áudio na tela de forma automática
        arquivosAudioforEach = arquivosAudio.forEach((nomeArquivo) => {
            const card = document.createElement('div');
            card.className = 'audio-card';

            const title = document.createElement('div');
            title.className = 'audio-title';
            // Tira a extensão .wav para o título ficar limpo na tela
            title.innerText = nomeArquivo.replace('.wav', '');

            const audio = document.createElement('audio');
            audio.controls = true;
            // Puxa o link direto do seu GitHub Pages
            audio.src = `https://carlosrichless.github.io/bateria-arquivos-som/${encodeURIComponent(nomeArquivo)}`;

            // LÓGICA DO EFEITO FITA: Quando um play é acionado, pausa todos os outros
            audio.addEventListener('play', () => {
                todosOsPlayers.forEach(outroAudio => {
                    if (outroAudio !== audio) {
                        outroAudio.pause();
                    }
                });
            });

            todosOsPlayers.push(audio);

            card.appendChild(title);
            card.appendChild(audio);
            container.appendChild(card);
        });
