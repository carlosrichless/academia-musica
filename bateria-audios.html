<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áudios VIP - Bateria (Spotify Style)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #000000;
            padding: 15px 20px;
            border-bottom: 1px solid #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.2rem;
            color: #fff;
            flex: 1;
            text-align: center;
        }
        /* Botão de Voltar estilo Spotify */
        .btn-voltar {
            background-color: #242424;
            color: #fff;
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-voltar:hover {
            background-color: #2a2a2a;
            transform: scale(1.02);
        }
        .header-spacer {
            width: 80px; 
        }

        /* Container principal da lista */
        .main-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 110px; /* Espaço para a barra fixa embaixo */
            background: linear-gradient(to bottom, #202020 0%, #121212 100%);
        }

        .playlist-title {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .audio-item {
            background-color: #181818;
            padding: 12px 16px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .audio-item:hover {
            background-color: #282828;
        }

        .audio-item.active {
            background-color: #282828;
            border-left: 4px solid #1db954;
        }

        .audio-item-name {
            font-size: 0.95rem;
            color: #fff;
        }

        .audio-item.active .audio-item-name {
            color: #1db954;
            font-weight: bold;
        }

        .play-icon-btn {
            background: #1db954;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Player Fixo Inferior estilo Spotify ("Now Playing Bar") */
        .now-playing-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .np-left {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 30%;
        }

        .np-thumb {
            width: 50px;
            height: 50px;
            background-color: #282828;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1db954;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .np-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .np-title {
            font-size: 0.9rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-subtitle {
            font-size: 0.75rem;
            color: #b3b3b3;
        }

        /* Controles centrais do player */
        .np-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 40%;
        }

        .np-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .np-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .np-btn:hover {
            color: #fff;
        }

        .np-btn-play {
            background-color: #fff;
            color: #000;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            transition: transform 0.1s;
        }

        .np-btn-play:hover {
            transform: scale(1.05);
            background-color: #1db954;
            color: #fff;
        }

        .np-progress-area {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            font-size: 0.75rem;
            color: #b3b3b3;
        }

        .np-progress-bar {
            flex: 1;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            outline: none;
            appearance: none;
            cursor: pointer;
        }

        .np-progress-bar::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #fff;
            display: none;
        }

        .np-progress-bar:hover::-webkit-slider-thumb {
            display: block;
        }

        .np-right {
            display: flex;
            justify-content: flex-end;
            width: 30%;
        }

        @media (max-width: 768px) {
            .np-left {
                width: 50%;
            }
            .np-right {
                display: none;
            }
            .np-center {
                width: 45%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="bateria-vip.html" class="btn-voltar">&#8592; Voltar</a>
        <h1>Áudios VIP - Apostila</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="main-container">
        <div class="playlist-title">Faixas de Áudio (.wav)</div>
        <div class="audio-list" id="audioList">
            <!-- Preenchido via JavaScript -->
        </div>
    </div>

    <!-- Barra de Player Estilo Spotify (Fixa Embaixo) -->
    <div class="now-playing-bar">
        <div class="np-left">
            <div class="np-thumb">♫</div>
            <div class="np-info">
                <div class="np-title" id="npTitle">Nenhuma faixa selecionada</div>
                <div class="np-subtitle">Carlos Richless - Bateria VIP</div>
            </div>
        </div>

        <div class="np-center">
            <div class="np-controls">
                <button class="np-btn" id="prevBtn" title="Anterior">&#9664;&#9664;</button>
                <button class="np-btn np-btn-play" id="playPauseBtn" title="Play/Pause">&#9654;</button>
                <button class="np-btn" id="nextBtn" title="Próxima">&#9654;&#9654;</button>
            </div>
            <div class="np-progress-area">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="np-progress-bar" value="0" min="0" max="100">
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="np-right">
            <!-- Espaço reservado para equilíbrio visual -->
        </div>
    </div>

    <!-- Elemento de Áudio Oculto -->
    <audio id="audioPlayer"></audio>

    <script>
        // URL base do repositório no GitHub Pages para os áudios .wav
        const baseUrl = "https://carlosrichless.github.io/bateria-arquivos-videovip/";

        // Lista de áudios (.wav) - Altere ou adicione conforme os arquivos reais do seu repositório
        const audios = [
            "exercicio-01.wav",
            "exercicio-02.wav",
            "exercicio-03.wav",
            "exercicio-04.wav"
        ];

        let currentIndex = 0;
        const audioPlayer = document.getElementById('audioPlayer');
        const audioListContainer = document.getElementById('audioList');
        const npTitle = document.getElementById('npTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function carregarLista() {
            audioListContainer.innerHTML = '';
            audios.forEach((filename, index) => {
                const item = document.createElement('div');
                item.className = `audio-item ${index === currentIndex ? 'active' : ''}`;
                
                const nomeLimpo = filename.replace('.wav', '');
                
                item.innerHTML = `
                    <span class="audio-item-name">${nomeLimpo}</span>
                    <button class="play-icon-btn">&#9654;</button>
                `;

                item.addEventListener('click', () => {
                    currentIndex = index;
                    tocarFaixa(currentIndex);
                });

                audioListContainer.appendChild(item);
            });
        }

        function tocarFaixa(index) {
            currentIndex = index;
            const filename = audios[currentIndex];
            const audioUrl = baseUrl + encodeURIComponent(filename);

            audioPlayer.src = audioUrl;
            npTitle.textContent = filename.replace('.wav', '');
            
            audioPlayer.play().then(() => {
                playPauseBtn.innerHTML = '&#10074;&#10074;'; // Ícone de pause
            }).catch(e => {
                console.log("Erro ao reproduzir áudio:", e);
            });

            carregarLista(); // Atualiza o destaque visual na lista
        }

        // Evento Botão Play/Pause principal
        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                if (!audioPlayer.src && audios.length > 0) {
                    tocarFaixa(0);
                } else {
                    audioPlayer.play();
                    playPauseBtn.innerHTML = '&#10074;&#10074;';
                }
            } else {
                audioPlayer.pause();
                playPauseBtn.innerHTML = '&#9654;';
            }
        });

        // Próxima e Anterior
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % audios.length;
            tocarFaixa(currentIndex);
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + audios.length) % audios.length;
            tocarFaixa(currentIndex);
        });

        // Atualizar barra de progresso
        audioPlayer.addEventListener('timeupdate', () => {
            if (audioPlayer.duration) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progress;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audioPlayer.duration);
        });

        // Permitir clicar na barra para avançar/retroceder o áudio
        progressBar.addEventListener('input', () => {
            if (audioPlayer.duration) {
                const time = (progressBar.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = time;
            }
        });

        // Quando terminar a faixa, toca a próxima automaticamente
        audioPlayer.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % audios.length;
            tocarFaixa(currentIndex);
        });

        // Inicialização
        carregarLista();
        if(audios.length > 0) {
            npTitle.textContent = audios[0].replace('.wav', '');
            audioPlayer.src = baseUrl + encodeURIComponent(audios[0]);
        }
    </script>
</body>
</html>
