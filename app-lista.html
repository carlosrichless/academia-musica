<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1db954">

  <title>APP LISTA BPM</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #34d399;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .topo {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .voltar {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.95rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
    }

    .voltar:hover {
      border-color: var(--accent);
    }

    .titulo {
      text-align: center;
      flex: 1;
    }

    .titulo h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .titulo p {
      margin: 6px 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.15rem;
    }

    .aluno-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .campo {
      flex: 1;
      min-width: 220px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .botao-principal {
      padding: 13px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: #020617;
      font-weight: bold;
      font-size: 0.95rem;
      align-self: end;
      min-height: 47px;
    }

    .botao-principal:hover {
      filter: brightness(1.08);
    }

    .alunos-salvos-titulo {
      margin-top: 14px;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: bold;
    }

    .lista-alunos-salvos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 2px;
    }

    .aluno-salvo {
      padding: 9px 12px;
      border-radius: 9px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.9rem;
      transition: 0.15s ease;
    }

    .aluno-salvo:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .aluno-salvo.vazio {
      width: 100%;
      color: var(--text-muted);
      text-align: left;
      padding: 8px 2px;
      background: transparent;
      border: none;
      cursor: default;
    }

    .aluno-salvo.vazio:hover {
      transform: none;
      border: none;
    }

    .mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 0.9rem;
    }

    .mensagem.sucesso {
      display: block;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: var(--success);
    }

    .mensagem.erro {
      display: block;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--danger);
    }

    .info-aluno {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 15px 18px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .info-aluno.ativo {
      display: flex;
    }

    .info-aluno strong {
      color: var(--accent);
    }

    .botao-sair {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 13px;
      border-radius: 8px;
    }

    .botao-sair:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .adicionar-grid {
      display: grid;
      grid-template-columns: 1fr 130px 130px auto;
      gap: 10px;
      align-items: end;
    }

    .botao-adicionar {
      min-height: 47px;
      padding: 0 18px;
      border-radius: 10px;
      background: var(--success);
      color: #022c22;
      font-weight: bold;
      white-space: nowrap;
    }

    .botao-adicionar:hover {
      filter: brightness(1.08);
    }

    .tabela-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    td {
      font-size: 0.95rem;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .vazio {
      text-align: center;
      color: var(--text-muted);
      padding: 35px 15px;
    }

    .acoes {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .acao {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .acao:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .acao.excluir:hover {
      border-color: var(--danger);
      color: var(--danger);
    }


    .nome-musica {
      color: var(--accent);
      cursor: pointer;
      font-weight: bold;
      display: inline-block;
    }

    .nome-musica:hover {
      text-decoration: underline;
    }

    .bloco-notas {
      margin-top: 12px;
      padding: 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: none;
    }

    .bloco-notas.aberto {
      display: block;
    }

    .bloco-notas-titulo {
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .campo-notas {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text-main);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
      outline: none;
    }

    .campo-notas:focus {
      border-color: var(--accent);
    }

    .notas-status {
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 0.75rem;
      min-height: 16px;
    }

    .botao-foto {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .botao-foto:hover {
      border-color: var(--accent);
    }

    .input-foto {
      display: none;
    }

    .foto-nota {
      display: block;
      max-width: 100%;
      max-height: 350px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .remover-foto {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .remover-foto:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .visualizador-foto {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #000;
    }

    .visualizador-foto.aberto {
      display: flex;
    }

    .visualizador-foto img {
      max-width: 100%;
      max-height: calc(100vh - 70px);
      object-fit: contain;
      border-radius: 8px;
    }

    .botao-voltar-foto {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 2;
      padding: 10px 14px;
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #475569;
      color: #f8fafc;
      font-size: 0.9rem;
    }

    .botao-voltar-foto:hover {
      border-color: var(--accent);
    }

    /* ============================================================
       METRÔNOMO INTERNO
       ============================================================ */

    .metronomo-interno {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #020617;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .metronomo-status {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-left: 2px;
    }

    .metronomo-controle {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .metronomo-controle:hover {
      border-color: var(--accent);
    }

    .metronomo-indicador {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-left: 2px;
    }

    .metronomo-indicador.tocando {
      background: var(--success);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.75);
    }

    .rodape-info {
      color: var(--text-muted);
      text-align: center;
      font-size: 0.75rem;
      margin-top: 25px;
      line-height: 1.5;
    }

    .carregando {
      opacity: 0.65;
      pointer-events: none;
    }

    @media (max-width: 750px) {
      body {
        padding: 10px;
      }

      .topo {
        align-items: flex-start;
      }

      .titulo h1 {
        font-size: 1.4rem;
      }

      .adicionar-grid {
        grid-template-columns: 1fr 1fr;
      }

      .adicionar-grid .campo-musica {
        grid-column: 1 / -1;
      }

      .botao-adicionar {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .topo {
        flex-direction: column;
      }

      .voltar {
        width: 100%;
        text-align: center;
      }

      .titulo {
        width: 100%;
      }

      .adicionar-grid {
        grid-template-columns: 1fr;
      }

      .adicionar-grid .campo-musica {
        grid-column: auto;
      }

      .campo {
        min-width: 100%;
      }

      .botao-principal {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div
    id="visualizadorFoto"
    class="visualizador-foto"
  >

    <button
      type="button"
      class="botao-voltar-foto"
      onclick="fecharFotoTelaCheia()"
    >
      ← Voltar
    </button>

    <img
      id="imagemTelaCheia"
      src=""
      alt="Foto ampliada"
    >

  </div>


  <div class="container">

    <div class="topo">

      <a href="index.html" class="voltar">
        ← Voltar
      </a>

      <div class="titulo">
        <h1>📝 APP LISTA BPM</h1>
        <p>Lista de músicas e metrônomo</p>
      </div>

    </div>


    <!-- IDENTIFICAÇÃO DO ALUNO -->
    <div class="card">

      <h2>👤 ALUNO(A)</h2>

      <div class="aluno-area">

        <div class="campo">
          <label for="nomeAluno">
            Nome do aluno
          </label>

          <input
            type="text"
            id="nomeAluno"
            placeholder="Digite seu nome ou procure abaixo"
            autocomplete="off"
            maxlength="100"
          >

          <div class="alunos-salvos-titulo">
            Alunos salvos
          </div>

          <div
            id="nomesAlunosSalvos"
            class="lista-alunos-salvos"
          >
          </div>
        </div>

        <button
          class="botao-principal"
          id="botaoEntrar"
          onclick="carregarAluno()"
        >
          ENTRAR
        </button>

      </div>

      <div id="mensagemLogin" class="mensagem"></div>

    </div>


    <!-- INFORMAÇÃO DO ALUNO -->
    <div
      id="infoAluno"
      class="info-aluno"
    >

      <div>
        Aluno(a):
        <strong id="nomeAlunoAtual"></strong>
      </div>

      <button
        class="botao-sair"
        onclick="sairAluno()"
      >
        Trocar aluno
      </button>

    </div>


    <!-- ADICIONAR MÚSICA -->
    <div
      class="card"
      id="cardAdicionar"
      style="display:none;"
    >

      <h2>➕ Adicionar música</h2>

      <div class="adicionar-grid">

        <div class="campo campo-musica">
          <label for="nomeMusica">
            Música
          </label>

          <input
            type="text"
            id="nomeMusica"
            placeholder="Nome da música"
            maxlength="200"
          >
        </div>


        <div class="campo">
          <label for="bpmMusica">
            BPM
          </label>

          <input
            type="number"
            id="bpmMusica"
            min="30"
            max="240"
            value="80"
          >
        </div>


        <div class="campo">
          <label for="compassoMusica">
            Compasso
          </label>

          <select id="compassoMusica">
            <option value="2/4">2/4</option>
            <option value="3/4">3/4</option>
            <option value="4/4" selected>4/4</option>
            <option value="5/4">5/4</option>
            <option value="6/8">6/8</option>
            <option value="7/8">7/8</option>
            <option value="9/8">9/8</option>
            <option value="12/8">12/8</option>
          </select>
        </div>


        <button
          class="botao-adicionar"
          onclick="adicionarMusica()"
        >
          + ADICIONAR
        </button>

      </div>

      <div id="mensagemMusica" class="mensagem"></div>

    </div>


    <!-- LISTA -->
    <div
      class="card"
      id="cardLista"
      style="display:none;"
    >

      <h2>🎵 Minhas músicas</h2>

      <div class="tabela-container">

        <table>

          <thead>
            <tr>
              <th>Música</th>
              <th>BPM</th>
              <th>Compasso</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="listaMusicas">

          </tbody>

        </table>

      </div>

    </div>


    <div class="rodape-info">
      APP LISTA BPM<br>
      As músicas ficam associadas ao nome informado pelo aluno.
    </div>

  </div>


  <!-- FIREBASE -->
  <script
    type="module"
    src="config-senhas.js"
  ></script>


  <script>

    /*
      ============================================================
      CONFIGURAÇÃO DO APP LISTA
      ============================================================
    */

    const CONFIG = {

      // ID DA PASTA PRINCIPAL DO GOOGLE DRIVE
      pastaDriveId:
        "1Oo7xW6Gi-Nr_bgb2L9wNO3okEDtXm6_G",

      // Nome da pasta principal
      nomePasta:
        "APP LISTA BPM",

      // Conta utilizada no Google Drive
      contaDrive:
        "applistabpm@gmail.com",

      /*
        ENDPOINT DO SERVIDOR

        GOOGLE APPS SCRIPT
      */

      API_URL:
        "https://script.google.com/macros/s/AKfycbzKzOg6AVBXdk6mt4BlEDD6p8qAmsBjuNWQsw0xo5KiCQ39EFwwg-fuYzwlExh0xwb2/exec",

      /*
        API ATIVA.
        O sistema passa a usar o Google Drive
        como armazenamento central.
      */

      usarModoLocal:
        false
    };


    /*
      ============================================================
      ESTADO DO APP
      ============================================================
    */

    let alunoAtual = "";

    let musicas = [];

    let notaAbertaId = null;

    let temporizadoresNotas = {};

    let nomesAlunosSalvos = [];

    let contextoAudioMetronomo = null;

    let osciladorMetronomo = null;

    let ganhoMetronomo = null;

    let temporizadorMetronomo = null;

    let metronomoTocandoId = null;

    let proximoTempoMetronomo = 0;

    let batidaMetronomo = 0;

    const AHEAD_TIME_METRONOMO = 0.10;

    const LOOKAHEAD_METRONOMO = 25;


    /*
      ============================================================
      NOMES DE ALUNOS SALVOS

      Os nomes exibidos aqui vêm SOMENTE do Google Drive.
      O navegador não mantém uma lista própria de alunos.
      ============================================================
    */

    let nomesAlunosSalvos = [];


    async function carregarNomesAlunosDoGoogleDrive() {

      const lista =
        document.getElementById("nomesAlunosSalvos");

      if (!lista) {
        return;
      }

      if (
        !CONFIG.API_URL ||
        CONFIG.usarModoLocal
      ) {
        nomesAlunosSalvos = [];
        renderizarNomesAlunosSalvos();
        return;
      }

      try {

        const resposta =
          await fetch(
            CONFIG.API_URL +
            "?acao=listarAlunos&_=" +
            Date.now()
          );

        if (!resposta.ok) {
          throw new Error(
            "Erro ao consultar os alunos salvos."
          );
        }

        const dados =
          await resposta.json();

        if (
          !dados ||
          !dados.sucesso ||
          !Array.isArray(dados.alunos)
        ) {
          throw new Error(
            dados && dados.erro
              ? dados.erro
              : "Resposta inválida do servidor."
          );
        }

        nomesAlunosSalvos =
          dados.alunos
            .map(
              nome => normalizarNome(String(nome))
            )
            .filter(Boolean);

        renderizarNomesAlunosSalvos();

      } catch (erro) {

        console.error(
          "Erro ao carregar nomes dos alunos do Google Drive:",
          erro
        );

        nomesAlunosSalvos = [];
        renderizarNomesAlunosSalvos();

      }

    }


    function renderizarNomesAlunosSalvos() {

      const lista =
        document.getElementById(
          "nomesAlunosSalvos"
        );

      if (!lista) {
        return;
      }

      lista.innerHTML = "";

      const campo =
        document.getElementById("nomeAluno");

      const busca =
        campo
          ? normalizarNome(campo.value).toLowerCase()
          : "";

      const nomesFiltrados =
        nomesAlunosSalvos.filter(
          nome =>
            !busca ||
            nome.toLowerCase().includes(busca)
        );

      if (nomesFiltrados.length === 0) {

        const vazio =
          document.createElement("div");

        vazio.className =
          "aluno-salvo vazio";

        vazio.textContent =
          busca
            ? "Nenhum aluno encontrado."
            : "Nenhum aluno salvo ainda.";

        lista.appendChild(vazio);

        return;
      }

      nomesFiltrados.forEach(
        nome => {

          const botao =
            document.createElement("button");

          botao.type = "button";
          botao.className = "aluno-salvo";
          botao.textContent = nome;
          botao.title =
            "Entrar como " + nome;

          botao.onclick =
            function() {

              document
                .getElementById("nomeAluno")
                .value = nome;

              carregarAluno();

            };

          lista.appendChild(botao);

        }
      );

    }


    /*
      ============================================================
      NORMALIZAÇÃO DO NOME
      ============================================================
    */

    function normalizarNome(nome) {

      return nome
        .trim()
        .replace(/\s+/g, " ");

    }


    /*
      ============================================================
      NOME PARA ARQUIVO
      ============================================================
    */

    function nomeArquivoAluno(nome) {

      return normalizarNome(nome)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9\s_-]/g, "")
        .replace(/\s+/g, "_")
        .toLowerCase();

    }


    /*
      ============================================================
      MENSAGENS
      ============================================================
    */

    function mostrarMensagem(elementoId, texto, tipo) {

      const elemento =
        document.getElementById(elementoId);

      elemento.textContent = texto;

      elemento.className =
        "mensagem " + tipo;

    }


    function esconderMensagem(elementoId) {

      const elemento =
        document.getElementById(elementoId);

      elemento.textContent = "";

      elemento.className =
        "mensagem";

    }


    /*
      ============================================================
      ENTRAR COMO ALUNO
      ============================================================
    */

    async function carregarAluno() {

      const campo =
        document.getElementById("nomeAluno");

      const nome =
        normalizarNome(campo.value);

        mostrarMensagem(

        return;

      alunoAtual = nome;
      notaAbertaId = null;

      /*

      if (

    function chaveLocal() {

        "app_lista_bpm_" +
        nomeArquivoAluno(alunoAtual)
      );

    function carregarDoNavegador() {

      const dados =
        localStorage.getItem(chaveLocal());

      if (!dados) {

        musicas = [];

        return;
      }


      try {

        const objeto =
          JSON.parse(dados);

        if (
          objeto &&
          Array.isArray(objeto.musicas)
        ) {

          musicas =
            objeto.musicas;

        } else {

          musicas = [];

        }

      } catch (erro) {

        console.error(
          "Erro ao ler lista local:",
          erro
        );

        musicas = [];

      }

    }


    /*
      ============================================================
      SALVAR MODO LOCAL TEMPORÁRIO
      ============================================================
    */

    function salvarNoNavegador() {

      const dados = {

        aluno:
          alunoAtual,

        musicas:
          musicas

      };


      localStorage.setItem(
        chaveLocal(),
        JSON.stringify(dados)
      );

    /*
      ============================================================
      GOOGLE DRIVE
      ============================================================
    */

    async function carregarDoGoogleDrive() {

      const resposta =
        await fetch(
          CONFIG.API_URL +
          "?acao=carregar" +
          "&aluno=" +
          encodeURIComponent(alunoAtual)
        );


      if (!resposta.ok) {

        throw new Error(
          "Erro ao consultar o servidor."
        );

      }


      const dados =
        await resposta.json();


      if (
        dados &&
        Array.isArray(dados.musicas)
      ) {

        musicas =
          dados.musicas;

      } else {

        musicas = [];

      }

    }


    async function salvarNoGoogleDrive() {

      const dados = {

        aluno:
          alunoAtual,

        musicas:
          musicas

      };


      const resposta =
        await fetch(
          CONFIG.API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
          "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify({
                acao:
                  "salvar",

                aluno:
                  alunoAtual,

                musicas:
                  musicas
              })
          }
        );


      if (!resposta.ok) {

        throw new Error(
          "Erro ao salvar no servidor."
        );

      }


      return await resposta.json();

    }

    /*
      ============================================================
      METRÔNOMO INTERNO
      ============================================================
    */

    function obterNumeradorCompasso(compasso) {

      const partes =
        String(compasso || "4/4").split("/");

      const numerador =
        parseInt(partes[0], 10);

      return Number.isInteger(numerador) &&
        numerador > 0
        ? numerador
        : 4;

    }


    function obterContextoAudioMetronomo() {

      if (!contextoAudioMetronomo) {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContext) {
          throw new Error(
            "O navegador não suporta áudio."
          );
        }

        contextoAudioMetronomo =
          new AudioContext();

      }

      return contextoAudioMetronomo;

    }


    function tocarBatidaMetronomo(
      contexto,
      tempo,
      batida,
      numerador
    ) {

      const oscilador =
        contexto.createOscillator();

      const ganho =
        contexto.createGain();

      const primeiraBatida =
        batida % numerador === 0;

      oscilador.type =
        "sine";

      oscilador.frequency.setValueAtTime(
        primeiraBatida ? 1500 : 1000,
        tempo
      );

      ganho.gain.setValueAtTime(
        0.0001,
        tempo
      );

      ganho.gain.exponentialRampToValueAtTime(
        0.22,
        tempo + 0.002
      );

      ganho.gain.exponentialRampToValueAtTime(
        0.0001,
        tempo + 0.055
      );

      oscilador.connect(ganho);
      ganho.connect(contexto.destination);

      oscilador.start(tempo);
      oscilador.stop(tempo + 0.06);

    }


    function agendarBatidasMetronomo() {

      if (
        metronomoTocandoId === null ||
        !contextoAudioMetronomo
      ) {
        return;
      }

      const musica =
        musicas.find(
          item =>
            item.id === metronomoTocandoId
        );

      if (!musica) {
        pararMetronomo();
        return;
      }

      const bpm =
        Math.max(
          30,
          Math.min(
            240,
            parseInt(musica.bpm, 10) || 80
          )
        );

      const numerador =
        obterNumeradorCompasso(
          musica.compasso
        );

      const intervalo =
        60 / bpm;

      const limite =
        contextoAudioMetronomo.currentTime +
        AHEAD_TIME_METRONOMO;

      while (
        proximoTempoMetronomo <
        limite
      ) {

        tocarBatidaMetronomo(
          contextoAudioMetronomo,
          proximoTempoMetronomo,
          batidaMetronomo,
          numerador
        );

        proximoTempoMetronomo +=
          intervalo;

        batidaMetronomo++;

      }

    }


    async function tocarMetronomo(id) {

      const musica =
        musicas.find(
          item => item.id === id
        );

      if (!musica) {
        return;
      }

      try {

        const contexto =
          obterContextoAudioMetronomo();

        if (
          contexto.state === "suspended"
        ) {

          await contexto.resume();

        }

        if (
          metronomoTocandoId !== null &&
          metronomoTocandoId !== id
        ) {

          pararMetronomo();

        }

        metronomoTocandoId =
          id;

        batidaMetronomo = 0;

        proximoTempoMetronomo =
          contexto.currentTime +
          0.05;

        clearInterval(
          temporizadorMetronomo
        );

        agendarBatidasMetronomo();

        temporizadorMetronomo =
          setInterval(
            agendarBatidasMetronomo,
            LOOKAHEAD_METRONOMO
          );

        renderizarLista();

      } catch (erro) {

        console.error(
          "Erro ao iniciar metrônomo:",
          erro
        );

        alert(
          "Não foi possível iniciar o metrônomo neste navegador."
        );

      }

    }


    function pararMetronomo() {

      clearInterval(
        temporizadorMetronomo
      );

      temporizadorMetronomo =
        null;

      metronomoTocandoId =
        null;

      proximoTempoMetronomo =
        0;

      batidaMetronomo =
        0;

      renderizarLista();

    }


    function alternarMetronomo(id) {

      if (
        metronomoTocandoId === id
      ) {

        pararMetronomo();

        return;

      }

      tocarMetronomo(id);

    }


    /*
      ============================================================
      EDITAR MÚSICA COMPLETAMENTE
      ============================================================
    */

    async function editarMusica(id) {

      const musica =
        musicas.find(
          item => item.id === id
        );


      if (!musica) {
        return;
      }


      const novoNome =
        prompt(
          "Nome da música:",
          musica.nome || ""
        );


      if (novoNome === null) {
        return;
      }


      const nome =
        novoNome.trim();


      if (!nome) {

        alert(
          "O nome da música não pode ficar vazio."
        );

        return;

      }


      const novoBpm =
        prompt(
          "BPM:",
          musica.bpm
        );


      if (novoBpm === null) {
        return;
      }


      const bpm =
        parseInt(
          novoBpm,
          10
        );


      if (
        !Number.isInteger(bpm) ||
        bpm < 30 ||
        bpm > 240
      ) {

        alert(
          "O BPM deve estar entre 30 e 240."
        );

        return;

      }


      const novoCompasso =
        prompt(
          "Fórmula de compasso:",
          musica.compasso || "4/4"
        );


      if (novoCompasso === null) {
        return;
      }


      const compasso =
        novoCompasso.trim();


      if (
        !/^\d+\/(2|4|8|16)$/.test(
          compasso
        )
      ) {

        alert(
          "Compasso inválido.\n\nUse, por exemplo: 4/4, 3/4, 6/8."
        );

        return;

      }


      const musicaAnterior = {

        nome:
          musica.nome,

        bpm:
          musica.bpm,

        compasso:
          musica.compasso

      };


      musica.nome =
        nome;

      musica.bpm =
        bpm;

      musica.compasso =
        compasso;


      try {

        await salvarLista();

        renderizarLista();

      } catch (erro) {

        console.error(erro);


        musica.nome =
          musicaAnterior.nome;

        musica.bpm =
          musicaAnterior.bpm;

        musica.compasso =
          musicaAnterior.compasso;


        renderizarLista();


        alert(
          "Não foi possível salvar a alteração."
        );

      }

    }


    /*
      ============================================================
      SENHA ADMINISTRATIVA FIREBASE
      ============================================================
    */

    async function verificarSenhaAdministrativa() {

      const senhaDigitada =
        prompt(
          "Digite a senha administrativa:"
        );


      if (
        senhaDigitada === null
      ) {

        return false;

      }


      if (
        !window.db ||
        !window.firestore
      ) {

        alert(
          "Não foi possível conectar ao Firebase."
        );

        return false;

      }


      try {

        const referencia =
          window.firestore.doc(
            window.db,
            "configuracoes",
            "sistema"
          );


        const documento =
          await window.firestore.getDoc(
            referencia
          );


        const dados =
          documento.exists()
            ? documento.data()
            : {};


        const senhaAdministrativa =
          dados.senha_admin_sistema || "";


        if (
          senhaAdministrativa &&
          senhaDigitada ===
            senhaAdministrativa
        ) {

          return true;

        }


        alert(
          "Senha administrativa incorreta."
        );


        return false;

      } catch (erro) {

        console.error(
          "Erro ao verificar senha administrativa:",
          erro
        );


        alert(
          "Erro ao conectar com a nuvem."
        );


        return false;

      }

    }


    /*
      ============================================================
      EXCLUIR MÚSICA
      ============================================================
    */

    async function excluirMusica(id) {

      const musica =
        musicas.find(
          item => item.id === id
        );


      if (!musica) {
        return;
      }


      const autorizado =
        await verificarSenhaAdministrativa();


      if (!autorizado) {
        return;
      }


      const confirmar =
        confirm(
          'Excluir a música "' +
          musica.nome +
          '"?'
        );


      if (!confirmar) {
        return;
      }


      const listaAnterior =
        [...musicas];


      musicas =
        musicas.filter(
          item => item.id !== id
        );


      try {

        await salvarLista();

        renderizarLista();

      } catch (erro) {

        console.error(erro);

        musicas =
          listaAnterior;

        renderizarLista();


        alert(
          "Não foi possível excluir a música."
        );

      }

    }



    /*
      ============================================================
      BLOCO DE NOTAS INDIVIDUAL DA MÚSICA
      ============================================================
    */

    function abrirBlocoNotas(id) {

      const musica =
        musicas.find(
          item => item.id === id
        );

      if (!musica) {
        return;
      }

      notaAbertaId =
        notaAbertaId === id
          ? null
          : id;

      renderizarLista();

      if (notaAbertaId !== null) {

        setTimeout(
          function() {

            const campo =
              document.querySelector(
                '.campo-notas[data-id="' +
                id +
                '"]'
              );

            if (campo) {

              campo.focus();

              campo.setSelectionRange(
                campo.value.length,
                campo.value.length
              );

            }

          },
          0
        );

      }

    }


    /*
      ============================================================
      SALVAMENTO AUTOMÁTICO DAS ANOTAÇÕES
      ============================================================
    */

    function agendarSalvamentoNota(id) {

      clearTimeout(
        temporizadoresNotas[id]
      );

      const status =
        document.querySelector(
          '.notas-status[data-id="' +
          id +
          '"]'
        );

      if (status) {
        status.textContent =
          "Salvando...";
      }

      temporizadoresNotas[id] =
        setTimeout(
          async function() {

            try {

              await salvarLista();

              const statusAtual =
                document.querySelector(
                  '.notas-status[data-id="' +
                  id +
                  '"]'
                );

              if (statusAtual) {
                statusAtual.textContent =
                  "Salvo automaticamente.";
              }

            } catch (erro) {

              console.error(erro);

              const statusAtual =
                document.querySelector(
                  '.notas-status[data-id="' +
                  id +
                  '"]'
                );

              if (statusAtual) {
                statusAtual.textContent =
                  "Erro ao salvar.";
              }

            }

          },
          700
        );

    }


    function alterarAnotacao(id, valor) {

      const musica =
        musicas.find(
          item => item.id === id
        );

      if (!musica) {
        return;
      }

      musica.anotacao =
        valor;

      agendarSalvamentoNota(id);

    }


    /*
      ============================================================
      FOTO DA ANOTAÇÃO
      ============================================================
    */

    function selecionarFoto(id) {

      const input =
        document.querySelector(
          '.input-foto[data-id="' +
          id +
          '"]'
        );

      if (input) {
        input.click();
      }

    }


    function adicionarFotoNota(id, arquivo) {

      if (!arquivo) {
        return;
      }

      const musica =
        musicas.find(
          item => item.id === id
        );

      if (!musica) {
        return;
      }

      if (!arquivo.type.startsWith("image/")) {

        alert(
          "Selecione uma imagem."
        );

        return;
      }

      const leitor =
        new FileReader();

      leitor.onload =
        function(evento) {

          musica.foto =
            evento.target.result;

          renderizarLista();

          agendarSalvamentoNota(id);

        };

      leitor.readAsDataURL(
        arquivo
      );

    }


    function abrirFotoTelaCheia(foto, nome) {

      const visualizador =
        document.getElementById("visualizadorFoto");

      const imagem =
        document.getElementById("imagemTelaCheia");

      if (!visualizador || !imagem || !foto) {
        return;
      }

      imagem.src = foto;
      imagem.alt =
        "Foto ampliada de " +
        (nome || "anotação");

      visualizador.classList.add("aberto");
      document.body.style.overflow = "hidden";

    }


    function fecharFotoTelaCheia() {

      const visualizador =
        document.getElementById("visualizadorFoto");

      const imagem =
        document.getElementById("imagemTelaCheia");

      if (!visualizador) {
        return;
      }

      visualizador.classList.remove("aberto");
      document.body.style.overflow = "";

      if (imagem) {
        imagem.src = "";
      }

    }


    function removerFotoNota(id) {

      const musica =
        musicas.find(
          item => item.id === id
        );

      if (!musica) {
        return;
      }

      musica.foto =
        "";

      renderizarLista();

      agendarSalvamentoNota(id);

    }


    /*
      ============================================================
      RENDERIZAR LISTA
      ============================================================
    */

    function renderizarLista() {

      const tbody =
        document.getElementById(
          "listaMusicas"
        );


      tbody.innerHTML = "";


      if (
        !musicas ||
        musicas.length === 0
      ) {

        const tr =
          document.createElement("tr");


        const td =
          document.createElement("td");


        td.colSpan = 4;

        td.className =
          "vazio";


        td.textContent =
          "Nenhuma música cadastrada ainda.";


        tr.appendChild(td);

        tbody.appendChild(tr);

        return;
      }


      musicas.forEach(
        musica => {

          const tr =
            document.createElement("tr");


          const tdNome =
            document.createElement("td");


          /*
            O NOME DA MÚSICA É O ÚNICO PONTO
            QUE ABRE O BLOCO DE NOTAS.
          */

          const nomeMusica =
            document.createElement("span");

          nomeMusica.className =
            "nome-musica";

          nomeMusica.textContent =
            musica.nome;

          nomeMusica.title =
            "Clique para abrir as anotações";

          nomeMusica.onclick =
            function() {

              abrirBlocoNotas(
                musica.id
              );

            };

          tdNome.appendChild(
            nomeMusica
          );


          /*
            BLOCO DE NOTAS INDIVIDUAL
          */

          if (
            notaAbertaId === musica.id
          ) {

            const bloco =
              document.createElement("div");

            bloco.className =
              "bloco-notas aberto";


            const titulo =
              document.createElement("div");

            titulo.className =
              "bloco-notas-titulo";

            titulo.textContent =
              "📝 Anotações de " +
              musica.nome;


            const campo =
              document.createElement("textarea");

            campo.className =
              "campo-notas";

            campo.dataset.id =
              musica.id;

            campo.placeholder =
              "Escreva aqui suas anotações para esta música...";

            campo.value =
              musica.anotacao || "";

            campo.addEventListener(
              "input",
              function() {

                alterarAnotacao(
                  musica.id,
                  campo.value
                );

              }
            );


            const botaoFoto =
              document.createElement("button");

            botaoFoto.type =
              "button";

            botaoFoto.className =
              "botao-foto";

            botaoFoto.textContent =
              "📷 Adicionar foto";

            botaoFoto.onclick =
              function() {

                selecionarFoto(
                  musica.id
                );

              };


            const inputFoto =
              document.createElement("input");

            inputFoto.type =
              "file";

            inputFoto.accept =
              "image/*";

            inputFoto.className =
              "input-foto";

            inputFoto.dataset.id =
              musica.id;

            inputFoto.addEventListener(
              "change",
              function() {

                adicionarFotoNota(
                  musica.id,
                  inputFoto.files[0]
                );

                inputFoto.value = "";

              }
            );


            const status =
              document.createElement("div");

            status.className =
              "notas-status";

            status.dataset.id =
              musica.id;

            if (
              musica.anotacao ||
              musica.foto
            ) {

              status.textContent =
                "Anotações salvas.";

            }


            bloco.appendChild(
              titulo
            );

            bloco.appendChild(
              campo
            );

            bloco.appendChild(
              botaoFoto
            );

            bloco.appendChild(
              inputFoto
            );


            if (musica.foto) {

              const imagem =
                document.createElement("img");

              imagem.className =
                "foto-nota";

              imagem.src =
                musica.foto;

              imagem.alt =
                "Foto da anotação de " +
                musica.nome;

              imagem.title =
                "Clique para abrir em tela cheia";

              imagem.onclick =
                function() {

                  abrirFotoTelaCheia(
                    musica.foto,
                    musica.nome
                  );

                };

              bloco.appendChild(
                imagem
              );


              const botaoTelaCheia =
                document.createElement("button");

              botaoTelaCheia.type =
                "button";

              botaoTelaCheia.className =
                "botao-foto";

              botaoTelaCheia.textContent =
                "⛶ Tela cheia";

              botaoTelaCheia.onclick =
                function() {

                  abrirFotoTelaCheia(
                    musica.foto,
                    musica.nome
                  );

                };

              bloco.appendChild(
                botaoTelaCheia
              );


              const remover =
                document.createElement("button");

              remover.type =
                "button";

              remover.className =
                "remover-foto";

              remover.textContent =
                "Remover foto";

              remover.onclick =
                function() {

                  removerFotoNota(
                    musica.id
                  );

                };

              bloco.appendChild(
                remover
              );

            }

            bloco.appendChild(
              status
            );

            tdNome.appendChild(
              bloco
            );

          }


          const tdBpm =
            document.createElement("td");

          tdBpm.textContent =
            musica.bpm;


          const tdCompasso =
            document.createElement("td");

          tdCompasso.textContent =
            musica.compasso;


          const tdAcoes =
            document.createElement("td");


          const acoes =
            document.createElement("div");

          acoes.className =
            "acoes";


          /*
            ▶ METRÔNOMO
          */

          const botaoPlay =
            document.createElement("button");

          botaoPlay.className =
            "acao";

          botaoPlay.title =
            metronomoTocandoId === musica.id
              ? "Pausar metrônomo"
              : "Tocar metrônomo";

          botaoPlay.textContent =
            metronomoTocandoId === musica.id
              ? "⏸"
              : "▶";

          botaoPlay.onclick =
            function() {

              alternarMetronomo(
                musica.id
              );

            };


          /*
            💾 EDITAR COMPLETAMENTE
          */

          const botaoEditar =
            document.createElement("button");

          botaoEditar.className =
            "acao editar";

          botaoEditar.title =
            "Editar música, BPM e compasso";

          botaoEditar.textContent =
            "💾";

          botaoEditar.onclick =
            function() {

              editarMusica(
                musica.id
              );

            };


          /*
            🗑️ EXCLUIR
          */

          const botaoExcluir =
            document.createElement("button");

          botaoExcluir.className =
            "acao excluir";

          botaoExcluir.title =
            "Excluir música";

          botaoExcluir.textContent =
            "🗑️";

          botaoExcluir.onclick =
            function() {

              excluirMusica(
                musica.id
              );

            };


          acoes.appendChild(
            botaoPlay
          );

          acoes.appendChild(
            botaoEditar
          );

          acoes.appendChild(
            botaoExcluir
          );


          tdAcoes.appendChild(
            acoes
          );


          if (
            metronomoTocandoId === musica.id
          ) {

            const painelMetronomo =
              document.createElement(
                "div"
              );

            painelMetronomo.className =
              "metronomo-interno";


            const indicador =
              document.createElement(
                "span"
              );

            indicador.className =
              "metronomo-indicador tocando";


            const status =
              document.createElement(
                "span"
              );

            status.className =
              "metronomo-status";

            status.textContent =
              musica.bpm +
              " BPM • " +
              (musica.compasso || "4/4") +
              " • Tocando";


            const botaoPausa =
              document.createElement(
                "button"
              );

            botaoPausa.type =
              "button";

            botaoPausa.className =
              "metronomo-controle";

            botaoPausa.title =
              "Pausar metrônomo";

            botaoPausa.textContent =
              "⏸";

            botaoPausa.onclick =
              function() {

                pararMetronomo();

              };


            painelMetronomo.appendChild(
              indicador
            );

            painelMetronomo.appendChild(
              status
            );

            painelMetronomo.appendChild(
              botaoPausa
            );

            tdAcoes.appendChild(
              painelMetronomo
            );

          }


          tr.appendChild(
            tdNome
          );

          tr.appendChild(
            tdBpm
          );

          tr.appendChild(
            tdCompasso
          );

          tr.appendChild(
            tdAcoes
          );


          tbody.appendChild(
            tr
          );

        }
      );

    }


    /*
      ============================================================
      TROCAR ALUNO
      ============================================================
    */

    function sairAluno() {

      pararMetronomo();

      Object.keys(
        temporizadoresNotas
      ).forEach(
        function(id) {

          clearTimeout(
            temporizadoresNotas[id]
          );

        }
      );

      temporizadoresNotas = {};

      alunoAtual = "";

      musicas = [];

      notaAbertaId = null;


      document
        .getElementById("nomeAluno")
        .value = "";


      document
        .getElementById("nomeAlunoAtual")
        .textContent = "";


      document
        .getElementById("infoAluno")
        .classList.remove("ativo");


      document
        .getElementById("cardAdicionar")
        .style.display = "none";


      document
        .getElementById("cardLista")
        .style.display = "none";


      esconderMensagem(
        "mensagemLogin"
      );


      document
        .getElementById("nomeAluno")
        .focus();

    }


    /*
      ============================================================
      INICIALIZAÇÃO DOS NOMES SALVOS
      ============================================================
    */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {
          fecharFotoTelaCheia();
        }

      }
    );


    carregarNomesAlunosDoGoogleDrive();


    /*
      ============================================================
      FILTRAR ALUNOS ENQUANTO DIGITA
      ============================================================
    */

    document
      .getElementById("nomeAluno")
      .addEventListener(
        "input",
        function() {

          renderizarNomesAlunosSalvos();

        }
      );


    /*
      ============================================================
      ENTER NO CAMPO DO ALUNO
      ============================================================
    */

    document
      .getElementById("nomeAluno")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            carregarAluno();

          }

        }
      );


    /*
      ============================================================
      ENTER NO CAMPO DA MÚSICA
      ============================================================
    */

    document
      .getElementById("nomeMusica")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            adicionarMusica();

          }

        }
      );


  </script>

</body>
</html>
