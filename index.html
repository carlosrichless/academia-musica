<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Academia de Música - Acesso</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #34d399;
            --danger: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .login-card h1 { color: var(--success); font-size: 1.8rem; margin-bottom: 10px; }
        .login-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; }
        .input-field {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }
        .input-field:focus { outline: none; border-color: var(--accent); }
        .btn-entrar {
            width: 100%;
            background: var(--accent);
            color: #0f172a;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-entrar:hover { background: #7dd3fc; }
        .erro-msg { color: var(--danger); font-size: 0.85rem; margin-top: 15px; display: none; }
        footer { margin-top: 25px; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🎵 Academia de Música</h1>
        <p>Digite sua senha de acesso geral:</p>
        
        <div class="input-group">
            <input type="password" id="senhaInput" class="input-field" placeholder="Senha de acesso..." autocomplete="current-password">
        </div>
        
        <button onclick="validarLogin()" class="btn-entrar">Entrar</button>
        <div id="erroMsg" class="erro-msg">Senha incorreta. Tente novamente.</div>

        <footer>
            C. Richless &copy; 2026
        </footer>
    </div>

    <!-- Importa o arquivo central de senhas -->
    <script src="config-senhas.js"></script>
    <script>
        function validarLogin() {
            let senhaDigitada = document.getElementById('senhaInput').value;

            if (typeof CONFIG_SISTEMA === 'undefined') {
                alert("Erro: Arquivo config-senhas.js não foi carregado corretamente!");
                return;
            }

            // Verifica se a senha bate com a senha geral do sistema configurada no config-senhas.js
            if (senhaDigitada === CONFIG_SISTEMA.senhaGeral) {
                sessionStorage.setItem('site_liberado', 'true');
                window.location.href = "painel-geral.html";
            } 
            // Ou se for a senha de admin
            else if (senhaDigitada === CONFIG_SISTEMA.senhaAdmin) {
                sessionStorage.setItem('site_liberado', 'true');
                window.location.href = "painel-admin.html";
            } else {
                document.getElementById('erroMsg').style.display = 'block';
            }
        }

        // Permite enviar com a tecla Enter
        document.getElementById('senhaInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                validarLogin();
            }
        });
    </script>
</body>
</html>
