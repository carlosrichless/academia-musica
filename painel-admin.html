<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | C. Richless</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #34d399;
            --danger: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.6; }
        
        .container { max-width: 800px; margin: 30px auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .btn-voltar { background: #334155; color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        .btn-voltar:hover { background: #475569; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card h2 { color: var(--success); margin-bottom: 15px; font-size: 1.4rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px; }
        .input-field {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }
        .input-field:focus { outline: none; border-color: var(--accent); }
        .info-txt { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="painel-geral.html" class="btn-voltar">← Voltar ao Painel Geral</a>
        </div>

        <div class="card">
            <h2>⚙️ Painel do Administrador</h2>
            <p class="info-txt">Aqui você gerencia as configurações gerais puxadas do arquivo <strong>config-senhas.js</strong>.</p>
            
            <div class="input-group">
                <label>Senha Geral do Site:</label>
                <input type="text" id="passSiteGeral" class="input-field" readonly>
            </div>

            <div class="input-group">
                <label>Senha do Administrador:</label>
                <input type="text" id="passAdmin" class="input-field" readonly>
            </div>
        </div>
    </div>

    <script src="config-senhas.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof CONFIG_SISTEMA !== 'undefined') {
                document.getElementById('passSiteGeral').value = CONFIG_SISTEMA.senhaSiteGeral;
                document.getElementById('passAdmin').value = CONFIG_SISTEMA.senhaAdminSistema;
            } else {
                alert("Aviso: config-senhas.js não carregado corretamente.");
            }
        });
    </script>
</body>
</html>
