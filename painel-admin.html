<script src="config-senhas.js"></script>
<script>
    function verificarSenha() {
        let senhaMestre = (typeof CONFIG_SISTEMA !== 'undefined') ? CONFIG_SISTEMA.senhaAdminSistema : "admin123";
        if(document.getElementById('senhaAdminInput').value === senhaMestre) {
            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('conteudoPainel').style.display = 'block';
            carregarDadosPainel();
        } else {
            document.getElementById('erroSenha').style.display = 'block';
        }
    }

    function carregarDadosPainel() {
        if (typeof CONFIG_SISTEMA === 'undefined') return;

        document.getElementById('passSiteGeral').value = CONFIG_SISTEMA.senhaSiteGeral;
        document.getElementById('passAdmin').value = CONFIG_SISTEMA.senhaAdminSistema;

        document.getElementById('inputImg').value = CONFIG_SISTEMA.midias.imagem;
        document.getElementById('inputAudio').value = CONFIG_SISTEMA.midias.audio;
        document.getElementById('inputVideo').value = CONFIG_SISTEMA.midias.video;
        document.getElementById('inputTempo').value = CONFIG_SISTEMA.mural.tempoDuracao;

        renderizarSenhasVip(CONFIG_SISTEMA.senhasVip);
        renderizarListaAvisos(CONFIG_SISTEMA.mural.avisos);
    }
    
    // As funções de salvamento agora podem atualizar o arquivo ou persistir localmente conforme sua preferência de deploy.
</script>
